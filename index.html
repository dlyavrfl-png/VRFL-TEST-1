<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SofaScore Ultra v7.0 NEON - CLEAN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --sofa-blue: #374DF5; --sofa-bg: #0f111a; --pitch-green: #4C9142; --neon-accent: #00f3ff; }
        body { background: var(--sofa-bg); font-family: 'Inter', sans-serif; overflow-x: hidden; margin: 0; color: #fff; }
        
        .active-tab { border-bottom: 3px solid var(--neon-accent); color: var(--neon-accent) !important; text-shadow: 0 0 10px var(--neon-accent); }
        .nav-item-active { color: var(--neon-accent) !important; font-weight: 800; text-shadow: 0 0 10px rgba(0,243,255,0.5); }
        
        .pitch { background: #1a4a16; background-image: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px), linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 40px 40px; border-radius: 12px; position: relative; border: 2px solid rgba(0,243,255,0.3); box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        .player-node { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; cursor: pointer; z-index: 10; }
        .p-circle { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--neon-accent); background: #111; overflow: hidden; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; box-shadow: 0 0 10px rgba(0,243,255,0.5); }
        
        /* Цвета рейтингов */
        .rate-high { background: #1A9D54 !important; } /* Зеленый */
        .rate-mid { background: #FFA500 !important; }  /* Оранжевый */
        .rate-low { background: #EF4444 !important; }  /* Красный */

        .p-rating { color: white; font-size: 8px; font-weight: 900; padding: 1px 4px; border-radius: 4px; margin-top: -10px; z-index: 20; border: 1px solid rgba(0,0,0,0.5); }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center; padding: 15px; }
        .neon-border { border: 1px solid rgba(0, 243, 255, 0.4); box-shadow: 0 0 15px rgba(0, 243, 255, 0.1); }
        .neon-card { background: #161925; color: white; border-radius: 16px; border-left: 4px solid var(--neon-accent); transition: 0.3s; }
        .neon-text { text-shadow: 0 0 10px var(--neon-accent); color: #fff; }
        
        .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
        .admin-input { background: #0a0a0f; border: 1px solid var(--neon-accent); color: white; padding: 4px 8px; border-radius: 4px; width: 120px; text-align: right; font-weight: bold; }
        
        .upload-overlay { position: relative; cursor: pointer; }
        .upload-overlay::after { content: '📷'; position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.2s; font-size: 24px; border-radius: inherit; }
        .upload-overlay:hover::after { opacity: 1; }
    </style>
</head>
<body class="pb-24">

    <div id="main-header" class="bg-[#161925] p-4 pt-10 text-white flex justify-between items-center shadow-[0_4px_20px_rgba(0,0,0,0.5)] border-b border-cyan-500/30">
        <h1 class="font-black text-xl italic tracking-tighter neon-text">SOFASCORE <span class="text-[10px] text-cyan-400 not-italic">v7.0</span></h1>
        <div class="flex gap-4 items-center">
            <span id="admin-badge" class="hidden bg-red-600 text-white text-[9px] font-black px-2 py-1 rounded">ADMIN</span>
            <button onclick="requestAdmin()"><svg class="w-6 h-6 opacity-50" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg></button>
        </div>
    </div>

    <div id="view-matches" class="p-3 space-y-4">
        <div class="p-3 flex items-center justify-between">
            <span class="text-[10px] font-black text-cyan-500 uppercase tracking-widest">ТУРЫ / МАТЧИ</span>
            <button id="btn-add-match" onclick="createNewMatch()" class="hidden bg-cyan-600 text-white text-[9px] font-bold px-3 py-1.5 rounded-full uppercase">Создать матч +</button>
        </div>
        <div id="match-list-container" class="space-y-3 mt-2"></div>
    </div>

    <div id="view-standings" class="p-3 hidden">
        <div class="neon-card p-4 overflow-x-auto">
            <h2 class="font-black text-sm uppercase mb-4 flex items-center gap-2"><span class="w-1 h-4 bg-cyan-400"></span>Таблица LIVE</h2>
            <table class="w-full text-left text-[11px] min-w-[300px]">
                <thead class="text-gray-400 border-b border-white/10">
                    <tr><th class="pb-2">#</th><th class="pb-2">КЛУБ</th><th class="pb-2 text-center">И</th><th class="pb-2 text-center">Г</th><th class="pb-2 text-center">О</th></tr>
                </thead>
                <tbody id="standings-body"></tbody>
            </table>
        </div>
    </div>

    <div id="view-scorers" class="p-3 hidden">
        <div class="neon-card p-4">
            <h2 class="font-black text-sm uppercase mb-4">Топ Бомбардиров</h2>
            <div id="scorers-list" class="space-y-4"></div>
        </div>
    </div>

    <div id="view-clubs" class="p-3 hidden">
        <div class="flex justify-between items-center mb-4 px-1">
            <span class="text-[10px] font-black text-gray-500 uppercase tracking-widest">Список клубов</span>
            <button id="btn-create-club" onclick="createNewClub()" class="hidden bg-green-600 text-white text-[9px] font-bold px-3 py-1.5 rounded-full uppercase">Создать клуб +</button>
        </div>
        <div id="clubs-list" class="space-y-4"></div>
    </div>

    <div id="club-page" class="fixed inset-0 bg-[#0f111a] z-[1400] hidden overflow-y-auto">
        <div class="bg-[#161925] p-5 pt-12 text-white border-b border-cyan-500/20">
            <button onclick="closeClubPage()" class="mb-6"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
            <div class="flex flex-col items-center mb-6">
                <div id="cp-logo" class="w-24 h-24 rounded-full bg-cover bg-center border-4 border-cyan-500 shadow-[0_0_20px_rgba(0,243,255,0.3)] mb-3 bg-[#111]"></div>
                <h2 id="cp-name" class="text-2xl font-black uppercase neon-text"></h2>
            </div>
            <div class="flex justify-between border-t border-white/10 text-[10px] font-black uppercase">
                <button onclick="cTab('info')" id="ct-info" class="p-4 active-tab w-1/2 text-center">Обзор</button>
                <button onclick="cTab('squad')" id="ct-squad" class="p-4 text-gray-500 w-1/2 text-center">Состав</button>
            </div>
        </div>
        <div class="p-4">
            <div id="cview-info" class="space-y-4"></div>
            <div id="cview-squad" class="hidden space-y-2"></div>
            <button id="btn-add-player" onclick="addNewPlayer()" class="hidden w-full mt-4 bg-cyan-900/50 text-cyan-400 p-4 rounded-xl border border-cyan-500/30 font-bold uppercase text-[10px]">Добавить игрока +</button>
        </div>
    </div>

    <div id="match-page" class="fixed inset-0 bg-[#0f111a] z-[1500] hidden overflow-y-auto">
        <div class="bg-[#161925] p-5 pt-12 text-white border-b border-cyan-500/20">
            <button onclick="closeMatch()" class="mb-8"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
            <div class="flex justify-around items-center mb-8">
                <div class="text-center w-1/3" onclick="openClubPage(curM().home)">
                    <div id="m-home-logo" class="w-16 h-16 mx-auto bg-[#111] rounded-full bg-cover bg-center border-2 border-cyan-500 mb-2"></div>
                    <div id="m-home-name" class="text-[10px] font-black uppercase"></div>
                </div>
                <div class="text-center w-1/3">
                    <div id="m-score" class="text-5xl font-black italic tracking-tighter neon-text">0-0</div>
                    <div id="m-status" class="text-[9px] font-black uppercase bg-red-600 px-2 py-0.5 rounded inline-block mt-2">LIVE</div>
                </div>
                <div class="text-center w-1/3" onclick="openClubPage(curM().away)">
                    <div id="m-away-logo" class="w-16 h-16 mx-auto bg-[#111] rounded-full bg-cover bg-center border-2 border-cyan-500 mb-2"></div>
                    <div id="m-away-name" class="text-[10px] font-black uppercase"></div>
                </div>
            </div>
            <div class="flex justify-between border-t border-white/10 text-[10px] font-black uppercase">
                <button onclick="mTab('det')" id="mt-det" class="p-4 active-tab w-1/3">Детали</button>
                <button onclick="mTab('line')" id="mt-line" class="p-4 text-gray-500 w-1/3">Составы</button>
                <button onclick="mTab('adm')" id="mt-adm" class="p-4 text-red-500 hidden w-1/3 italic">Админ</button>
            </div>
        </div>

        <div class="p-3">
            <div id="mview-det" class="neon-card p-5 space-y-4"></div>
            <div id="mview-line" class="hidden">
                <div class="pitch w-full h-[480px] mb-4"><div id="pitch-players"></div></div>
            </div>
            
            <div id="mview-adm" class="hidden bg-red-900/20 p-5 rounded-xl border-2 border-red-500/50 space-y-4">
                <div class="grid grid-cols-2 gap-2">
                    <input id="as-h" type="number" class="p-3 bg-black border border-red-500 rounded font-black text-center text-white" placeholder="Дома">
                    <input id="as-a" type="number" class="p-3 bg-black border border-red-500 rounded font-black text-center text-white" placeholder="Гости">
                </div>
                <select id="as-status" class="w-full p-3 bg-black border border-red-500 rounded text-white text-sm font-bold">
                    <option value="LIVE">LIVE</option><option value="FT">FT</option><option value="UPC">UPC</option>
                </select>
                <div class="flex gap-2 border-t border-red-500/30 pt-4 mt-2">
                    <input id="ae-m" type="number" class="w-1/4 p-3 bg-black border border-red-500 rounded text-white" placeholder="Мин.">
                    <input id="ae-t" type="text" class="w-3/4 p-3 bg-black border border-red-500 rounded text-white" placeholder="Событие">
                </div>
                <button onclick="saveAdminMatch()" class="w-full bg-red-600 text-white p-4 rounded-xl font-bold uppercase text-xs">Обновить матч</button>
            </div>
        </div>
    </div>

    <div id="player-modal" class="modal">
        <div class="bg-[#161925] w-full max-w-sm rounded-3xl overflow-hidden neon-border">
            <div class="p-6 bg-[#0a0a0f] flex items-center gap-4 border-b border-cyan-500/20">
                <div class="w-16 h-16 rounded-full bg-cover bg-center border-2 border-cyan-500" id="pm-photo"></div>
                <h3 id="pm-name" class="font-black text-xl neon-text"></h3>
            </div>
            <div class="p-6 space-y-4">
                <div id="pm-adm" class="space-y-2">
                    <input id="ai-r" type="number" step="0.1" class="w-full p-2 bg-black border border-red-500 rounded text-xs text-white" placeholder="Рейтинг в матче (напр. 7.2)">
                    <div class="grid grid-cols-2 gap-2">
                         <input id="ai-g" type="number" class="p-2 bg-black border border-red-500 rounded text-xs text-white" placeholder="Голы">
                         <input id="ai-pos-t" type="text" class="p-2 bg-black border border-red-500 rounded text-xs text-white" placeholder="Топ %">
                         <input id="ai-pos-l" type="text" class="p-2 bg-black border border-red-500 rounded text-xs text-white" placeholder="Лево %">
                    </div>
                    <button onclick="savePlayerData()" class="w-full bg-red-600 text-white p-3 rounded-xl font-bold uppercase text-[10px]">Сохранить статы</button>
                </div>
                <button onclick="document.getElementById('player-modal').style.display='none'" class="w-full bg-gray-800 p-3 rounded-xl font-bold text-[10px] uppercase">Закрыть</button>
            </div>
        </div>
    </div>

    <div id="profile-modal" class="modal">
        <div class="bg-[#161925] w-full max-w-sm rounded-3xl overflow-hidden neon-border h-[70vh] overflow-y-auto">
            <div class="p-6 flex flex-col items-center">
                <div class="w-24 h-24 rounded-full bg-cover bg-center border-4 border-cyan-500 mb-4" id="prof-photo"></div>
                <h3 id="prof-name-display" class="font-black text-2xl uppercase neon-text"></h3>
            </div>
            <div class="p-6 pt-0 space-y-2" id="prof-edit-mode">
                <div class="flex justify-between items-center text-xs text-gray-400">Имя <input id="p-e-name" type="text" class="admin-input"></div>
                <div class="flex justify-between items-center text-xs text-gray-400">Гражданство <input id="p-e-cit" type="text" class="admin-input"></div>
                <div class="flex justify-between items-center text-xs text-gray-400">Рейтинг ОБЩ <input id="p-e-rating" type="text" class="admin-input"></div>
                <div class="flex justify-between items-center text-xs text-gray-400">Позиция <input id="p-e-pos" type="text" class="admin-input"></div>
                <div class="flex justify-between items-center text-xs text-gray-400">Стоимость <input id="p-e-val" type="text" class="admin-input"></div>
                <button onclick="savePlayerProfile()" class="w-full mt-4 bg-red-600 text-white p-3 rounded-xl font-bold uppercase text-[10px]">Сохранить</button>
            </div>
            <div class="p-4"><button onclick="document.getElementById('profile-modal').style.display='none'" class="w-full bg-gray-800 p-4 rounded-2xl font-black text-[10px] uppercase">Закрыть</button></div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-[#0a0a0f] border-t border-cyan-500/30 flex justify-around py-4 z-[1000]">
        <button onclick="nav('matches')" id="nv-matches" class="flex flex-col items-center gap-1 nav-item-active"><span class="text-[8px] uppercase font-black">Матчи</span></button>
        <button onclick="nav('standings')" id="nv-standings" class="flex flex-col items-center gap-1 text-gray-500"><span class="text-[8px] uppercase font-black">Таблица</span></button>
        <button onclick="nav('scorers')" id="nv-scorers" class="flex flex-col items-center gap-1 text-gray-500"><span class="text-[8px] uppercase font-black">Топ</span></button>
        <button onclick="nav('clubs')" id="nv-clubs" class="flex flex-col items-center gap-1 text-gray-500"><span class="text-[8px] uppercase font-black">Клубы</span></button>
    </div>

    <input type="file" id="img-input" class="hidden" accept="image/*">

    <script>
        // ИНИЦИАЛИЗАЦИЯ (ПУСТАЯ БАЗА)
        let state = JSON.parse(localStorage.getItem('sofa_v10_clean')) || {
            isAdmin: false,
            teams: {},
            matches: []
        };

        function save() { localStorage.setItem('sofa_v10_clean', JSON.stringify(state)); applyAdminUI(); }

        // ЦВЕТОВАЯ ЛОГИКА
        function getRateClass(val) {
            const r = parseFloat(val);
            if (r >= 7.0) return 'rate-high';
            if (r >= 6.0) return 'rate-mid';
            return 'rate-low';
        }

        // АДМИН ПАРОЛЬ
        function requestAdmin() { 
            if(state.isAdmin) { if(confirm("Выйти?")) { state.isAdmin = false; save(); location.reload(); } return; }
            if(prompt("Введи пароль:") === "4774") { state.isAdmin = true; save(); alert("Доступ открыт!"); location.reload(); } 
        }

        function applyAdminUI() {
            const method = state.isAdmin ? 'remove' : 'add';
            ['admin-badge', 'btn-add-match', 'btn-add-player', 'btn-create-club', 'mt-adm', 'pm-adm'].forEach(id => {
                const el = document.getElementById(id); if(el) el.classList[method]('hidden');
            });
            if(state.isAdmin) {
                document.getElementById('cp-logo').classList.add('upload-overlay');
                document.getElementById('prof-photo').classList.add('upload-overlay');
            }
        }

        // ФОТО
        function triggerImageUpload(cb) {
            if(!state.isAdmin) return;
            const inp = document.getElementById('img-input');
            inp.onchange = e => {
                const reader = new FileReader();
                reader.onload = () => cb(reader.result);
                if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
                inp.value = '';
            };
            inp.click();
        }

        // НАВИГАЦИЯ
        function nav(v) {
            ['matches', 'standings', 'scorers', 'clubs'].forEach(x => { 
                document.getElementById('view-'+x).classList.add('hidden'); 
                document.getElementById('nv-'+x).className = 'flex flex-col items-center gap-1 text-gray-500'; 
            });
            document.getElementById('view-'+v).classList.remove('hidden'); 
            document.getElementById('nv-'+v).className = 'flex flex-col items-center gap-1 nav-item-active';
            if(v === 'matches') renderMatches();
            if(v === 'standings') renderStandings();
            if(v === 'scorers') renderScorers();
            if(v === 'clubs') renderClubs();
        }

        // МАТЧИ
        function renderMatches() {
            const cont = document.getElementById('match-list-container');
            cont.innerHTML = state.matches.length ? state.matches.map(m => `
                <div onclick="openMatch(${m.id})" class="neon-card p-4 flex justify-between items-center cursor-pointer">
                    <div class="flex-1 space-y-2">
                        <div class="flex items-center gap-2 text-xs font-bold"><div class="w-4 h-4 rounded-full bg-cover bg-center border border-white/10" style="background-image:url('${state.teams[m.home]?.logo || ''}')"></div>${m.home}</div>
                        <div class="flex items-center gap-2 text-xs font-bold"><div class="w-4 h-4 rounded-full bg-cover bg-center border border-white/10" style="background-image:url('${state.teams[m.away]?.logo || ''}')"></div>${m.away}</div>
                    </div>
                    <div class="text-right font-black italic text-lg neon-text">${m.hScore}-${m.aScore}</div>
                </div>
            `).join('') : '<p class="text-center text-gray-600 text-[10px] py-10 uppercase">Нет матчей</p>';
        }

        function createNewMatch() {
            const h = prompt("Дома:"); const a = prompt("Гости:");
            if(state.teams[h] && state.teams[a]) {
                state.matches.push({id: Date.now(), home: h, away: a, hScore: 0, aScore: 0, status: 'UPC', events: []});
                save(); renderMatches();
            } else alert("Клуб не найден!");
        }

        let activeMid = null;
        const curM = () => state.matches.find(x => x.id === activeMid);

        function openMatch(id) { activeMid = id; document.getElementById('match-page').classList.remove('hidden'); mTab('det'); }
        function closeMatch() { document.getElementById('match-page').classList.add('hidden'); activeMid = null; }

        function mTab(t) {
            ['det', 'line', 'adm'].forEach(x => { document.getElementById('mview-'+x).classList.add('hidden'); document.getElementById('mt-'+x).className = 'p-4 text-gray-500 w-1/3'; });
            document.getElementById('mview-'+t).classList.remove('hidden'); document.getElementById('mt-'+t).className = 'p-4 active-tab w-1/3';
            renderMatchInfo();
        }

        function renderMatchInfo() {
            const m = curM(); if(!m) return;
            document.getElementById('m-home-name').innerText = m.home; document.getElementById('m-away-name').innerText = m.away;
            document.getElementById('m-score').innerText = `${m.hScore}-${m.aScore}`;
            document.getElementById('m-home-logo').style.backgroundImage = `url('${state.teams[m.home]?.logo || ''}')`;
            document.getElementById('m-away-logo').style.backgroundImage = `url('${state.teams[m.away]?.logo || ''}')`;
            
            const pArea = document.getElementById('pitch-players'); pArea.innerHTML = '';
            [...(state.teams[m.home]?.players || []), ...(state.teams[m.away]?.players || [])].forEach(p => {
                const div = document.createElement('div'); div.className = 'player-node'; div.style.top = p.pos.t; div.style.left = p.pos.l;
                div.onclick = (e) => { e.stopPropagation(); openPlayerStats(p.id); };
                div.innerHTML = `<div class="p-circle" style="background-image:url('${p.img || ''}')"></div><div class="p-rating ${getRateClass(p.r)}">${p.r.toFixed(1)}</div><span class="text-[7px] font-black mt-1">${p.name}</span>`;
                pArea.appendChild(div);
            });
            document.getElementById('mview-det').innerHTML = m.events.map(e => `<div class="text-xs"><span class="text-cyan-400 font-bold">${e.min}'</span> ${e.txt}</div>`).join('') || 'Нет событий';
        }

        function saveAdminMatch() {
            const m = curM(); m.hScore = document.getElementById('as-h').value; m.aScore = document.getElementById('as-a').value;
            m.status = document.getElementById('as-status').value;
            const min = document.getElementById('ae-m').value; const txt = document.getElementById('ae-t').value;
            if(min && txt) m.events.push({min, txt});
            save(); renderMatchInfo();
        }

        // КЛУБЫ
        function renderClubs() {
            document.getElementById('clubs-list').innerHTML = Object.keys(state.teams).map(name => `
                <div onclick="openClubPage('${name}')" class="neon-card p-4 flex items-center gap-4 cursor-pointer">
                    <div class="w-12 h-12 rounded-full bg-cover bg-center border border-cyan-500/30" style="background-image:url('${state.teams[name].logo}')"></div>
                    <div class="font-black uppercase text-sm">${name}</div>
                </div>
            `).join('') || '<p class="text-center text-gray-600 py-10">Пусто</p>';
        }

        function createNewClub() {
            const n = prompt("Имя клуба:");
            if(n) { state.teams[n] = {logo: '', stadium: '-', capacity: '-', players: []}; save(); renderClubs(); }
        }

        let activeClub = null;
        function openClubPage(name) {
            activeClub = name; document.getElementById('club-page').classList.remove('hidden');
            document.getElementById('cp-name').innerText = name;
            const logoEl = document.getElementById('cp-logo');
            logoEl.style.backgroundImage = `url('${state.teams[name].logo}')`;
            logoEl.onclick = () => triggerImageUpload(img => { state.teams[name].logo = img; save(); openClubPage(name); });
            cTab('info');
        }

        function closeClubPage() { document.getElementById('club-page').classList.add('hidden'); activeClub = null; }

        function cTab(t) {
            ['info', 'squad'].forEach(x => { document.getElementById('cview-'+x).classList.add('hidden'); document.getElementById('ct-'+x).className = 'p-4 text-gray-500 w-1/2 text-center'; });
            document.getElementById('cview-'+t).classList.remove('hidden'); document.getElementById('ct-'+t).className = 'p-4 active-tab w-1/2 text-center';
            renderClubInfo();
        }

        function renderClubInfo() {
            const t = state.teams[activeClub];
            document.getElementById('cview-info').innerHTML = `<div class="neon-card p-4 text-xs">Стадион: ${t.stadium}<br>Вместимость: ${t.capacity}</div>`;
            document.getElementById('cview-squad').innerHTML = t.players.map(p => `
                <div onclick="openProfileModal(${p.id})" class="neon-card p-3 flex items-center justify-between">
                    <div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-cover bg-center" style="background-image:url('${p.img}')"></div><span class="text-xs font-bold">${p.name}</span></div>
                    <span class="text-[10px] font-black px-2 py-1 rounded ${getRateClass(p.prof.rating)}">${p.prof.rating}</span>
                </div>
            `).join('');
        }

        function addNewPlayer() {
            const n = prompt("Имя игрока:");
            if(n) { state.teams[activeClub].players.push({id: Date.now(), name: n, img: '', r: 6.0, g: 0, pos: {t: '50%', l: '50%'}, prof: {cit: '-', rating: '6.0', pos: '-', val: '-'}}); save(); renderClubInfo(); }
        }

        // ПРОФИЛИ
        let activePid = null;
        function openProfileModal(id) {
            activePid = id; let p; for(let t in state.teams) { let f = state.teams[t].players.find(x => x.id === id); if(f) p = f; }
            document.getElementById('prof-name-display').innerText = p.name;
            const photoEl = document.getElementById('prof-photo');
            photoEl.style.backgroundImage = `url('${p.img}')`;
            photoEl.onclick = () => triggerImageUpload(img => { p.img = img; save(); openProfileModal(id); });
            document.getElementById('p-e-name').value = p.name;
            document.getElementById('p-e-rating').value = p.prof.rating;
            document.getElementById('profile-modal').style.display = 'flex';
        }

        function savePlayerProfile() {
            let p; for(let t in state.teams) { let f = state.teams[t].players.find(x => x.id === activePid); if(f) p = f; }
            p.name = document.getElementById('p-e-name').value;
            p.prof.rating = document.getElementById('p-e-rating').value;
            save(); document.getElementById('profile-modal').style.display = 'none'; renderClubInfo();
        }

        let activePStatId = null;
        function openPlayerStats(id) {
            activePStatId = id; let p; for(let t in state.teams) { let f = state.teams[t].players.find(x => x.id === id); if(f) p = f; }
            document.getElementById('pm-name').innerText = p.name;
            document.getElementById('pm-photo').style.backgroundImage = `url('${p.img}')`;
            document.getElementById('ai-r').value = p.r; document.getElementById('ai-g').value = p.g;
            document.getElementById('ai-pos-t').value = p.pos.t; document.getElementById('ai-pos-l').value = p.pos.l;
            document.getElementById('player-modal').style.display = 'flex';
        }

        function savePlayerData() {
            let p; for(let t in state.teams) { let f = state.teams[t].players.find(x => x.id === activePStatId); if(f) p = f; }
            p.r = parseFloat(document.getElementById('ai-r').value); p.g = parseInt(document.getElementById('ai-g').value);
            p.pos.t = document.getElementById('ai-pos-t').value; p.pos.l = document.getElementById('ai-pos-l').value;
            save(); renderMatchInfo(); document.getElementById('player-modal').style.display='none';
        }

        function renderStandings() {
            let res = Object.keys(state.teams).map(n => {
                let pts = 0;
                state.matches.forEach(m => {
                    if(m.home === n) pts += m.hScore > m.aScore ? 3 : (m.hScore === m.aScore ? 1 : 0);
                    if(m.away === n) pts += m.aScore > m.hScore ? 3 : (m.hScore === m.aScore ? 1 : 0);
                });
                return {n, pts};
            }).sort((a,b) => b.pts - a.pts);
            document.getElementById('standings-body').innerHTML = res.map((r, i) => `<tr class="border-b border-white/5"><td class="py-3">${i+1}</td><td class="font-bold">${r.n}</td><td class="text-center">-</td><td class="text-center">-</td><td class="text-center font-black text-cyan-400">${r.pts}</td></tr>`).join('');
        }

        function renderScorers() {
            let list = []; for(let t in state.teams) state.teams[t].players.forEach(p => list.push({...p, tName: t}));
            list.sort((a,b) => b.g - a.g);
            document.getElementById('scorers-list').innerHTML = list.map(p => `<div class="neon-card p-3 flex justify-between"><span>${p.name} <span class="text-[8px] opacity-50">${p.tName}</span></span><span>${p.g} ⚽</span></div>`).join('');
        }

        applyAdminUI();
        nav('matches');
    </script>
</body>
</html>
