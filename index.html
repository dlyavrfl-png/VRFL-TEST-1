<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UFFLSCORE - ADMIN PANEL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --uffl-blue: #374DF5; --uffl-bg: #0f111a; --pitch-green: #4C9142; --neon-accent: #00f3ff; }
        body { background: var(--uffl-bg); font-family: 'Inter', sans-serif; overflow-x: hidden; margin: 0; color: #fff; }
        
        /* Loading Screen */
        #splash-screen { transition: opacity 0.3s ease-out; z-index: 9999; }
        .spinner { border: 4px solid rgba(0, 243, 255, 0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: var(--neon-accent); animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .active-tab { border-bottom: 3px solid var(--neon-accent); color: var(--neon-accent) !important; text-shadow: 0 0 10px var(--neon-accent); }
        .nav-item-active { color: var(--neon-accent) !important; font-weight: 800; text-shadow: 0 0 10px rgba(0,243,255,0.5); }
        
        .pitch { background: #1a4a16; background-image: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px), linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 40px 40px; border-radius: 12px; position: relative; border: 2px solid rgba(0,243,255,0.3); box-shadow: inset 0 0 30px rgba(0,0,0,0.8); }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center; padding: 15px; backdrop-filter: blur(5px); }
        
        .neon-border { border: 1px solid rgba(0, 243, 255, 0.4); box-shadow: 0 0 20px rgba(0, 243, 255, 0.15); }
        .neon-card { background: linear-gradient(145deg, #161925, #11131c); color: white; border-radius: 16px; border-left: 4px solid var(--neon-accent); transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .neon-text { text-shadow: 0 0 10px var(--neon-accent); color: #fff; }
        
        .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
        .admin-input { background: #0a0a0f; border: 1px solid var(--neon-accent); color: white; padding: 6px 10px; border-radius: 6px; width: 140px; text-align: right; font-weight: bold; outline: none; }
        .admin-input:focus { box-shadow: 0 0 10px rgba(0,243,255,0.3); }
    </style>
</head>
<body class="pb-24">

    <div id="splash-screen" class="fixed inset-0 bg-[#0a0a0f] flex flex-col items-center justify-center">
        <h1 class="text-5xl font-black italic tracking-tighter neon-text mb-6">UFFLSCORE</h1>
        <div class="spinner"></div>
    </div>

    <div id="main-header" class="bg-[#161925] p-4 pt-10 text-white flex justify-between items-center shadow-[0_4px_20px_rgba(0,0,0,0.5)] border-b border-cyan-500/30">
        <h1 class="font-black text-2xl italic tracking-tighter neon-text">UFFLSCORE</h1>
        <div class="flex gap-4 items-center">
            <span id="admin-badge" class="hidden bg-red-600 text-white text-[9px] font-black px-2 py-1 rounded shadow-[0_0_10px_rgba(220,38,38,0.5)]">ADMIN</span>
            <button onclick="requestAdmin()"><svg class="w-6 h-6 opacity-50 hover:opacity-100 transition" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg></button>
        </div>
    </div>

    <div id="view-matches" class="p-3 space-y-4 view-section">
        <div class="flex items-center justify-between border-b border-white/10 pb-2">
            <span class="text-[10px] font-black text-cyan-500 uppercase tracking-widest">ТУРЫ И МАТЧИ</span>
            <button id="btn-add-tour" onclick="createNewTour()" class="hidden admin-el bg-cyan-600 hover:bg-cyan-500 text-white text-[9px] font-bold px-3 py-1.5 rounded uppercase transition">Создать Тур +</button>
        </div>
        <div id="tours-list-container" class="space-y-4 mt-2"></div>
    </div>

    <div id="view-standings" class="p-3 hidden view-section">
        <div class="neon-card p-4 overflow-x-auto">
            <h2 class="font-black text-sm uppercase mb-4 flex items-center gap-2"><span class="w-1 h-4 bg-cyan-400"></span>Таблица LIVE</h2>
            <table class="w-full text-left text-[11px] min-w-[300px]">
                <thead class="text-gray-400 border-b border-white/10">
                    <tr><th class="pb-2">#</th><th class="pb-2">КЛУБ</th><th class="pb-2 text-center">И</th><th class="pb-2 text-center">Г</th><th class="pb-2 text-center">О</th></tr>
                </thead>
                <tbody id="standings-body"></tbody>
            </table>
        </div>
    </div>

    <div id="view-scorers" class="p-3 hidden view-section">
        <div class="neon-card p-4">
            <h2 class="font-black text-sm uppercase mb-4 flex items-center gap-2"><span class="w-1 h-4 bg-cyan-400"></span>Топ Бомбардиров</h2>
            <div id="scorers-list" class="space-y-4"></div>
        </div>
    </div>

    <div id="view-clubs" class="p-3 hidden view-section">
        <div class="flex justify-between items-center px-2 mb-2">
            <span class="text-[10px] font-black text-cyan-500 uppercase tracking-widest">Все клубы</span>
            <button id="btn-create-club" onclick="createNewClub()" class="hidden admin-el bg-cyan-600 hover:bg-cyan-500 text-white text-[9px] font-bold px-3 py-1.5 rounded uppercase transition">Новый клуб +</button>
        </div>
        <div id="clubs-list" class="space-y-4"></div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-[#0a0a0f] border-t border-cyan-500/30 flex justify-around py-4 z-[1000] shadow-[0_-5px_20px_rgba(0,243,255,0.1)]">
        <button onclick="nav('matches')" id="nv-matches" class="flex flex-col items-center gap-1 nav-item-active transition hover:scale-110"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg><span class="text-[8px] uppercase font-black">Матчи</span></button>
        <button onclick="nav('standings')" id="nv-standings" class="flex flex-col items-center gap-1 text-gray-500 transition hover:scale-110"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg><span class="text-[8px] uppercase font-black">Таблица</span></button>
        <button onclick="nav('scorers')" id="nv-scorers" class="flex flex-col items-center gap-1 text-gray-500 transition hover:scale-110"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg><span class="text-[8px] uppercase font-black">Топ</span></button>
        <button onclick="nav('clubs')" id="nv-clubs" class="flex flex-col items-center gap-1 text-gray-500 transition hover:scale-110"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span class="text-[8px] uppercase font-black">Клубы</span></button>
    </div>

    <script>
        // ИНИЦИАЛИЗАЦИЯ И ИСПРАВЛЕННЫЙ STATE
        let state = JSON.parse(localStorage.getItem('uffl_data_v1')) || {
            isAdmin: false,
            teams: {},
            tours: [] // Новая структура: Туры содержат матчи
        };

        // Быстрая загрузка (убрал 1.5 секунды, оставил минимум для красивого старта)
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 300);
            }, 300);
            renderAll();
        });

        function save() {
            localStorage.setItem('uffl_data_v1', JSON.stringify(state));
            renderAll();
        }

        function renderAll() {
            applyAdminUI();
            renderTours();
            renderClubs();
            renderStandings();
            renderScorers();
        }

        // АДМИН ПАНЕЛЬ С ПАРОЛЕМ 4774
        function requestAdmin() {
            if(state.isAdmin) {
                state.isAdmin = false;
                save(); return;
            }
            const pwd = prompt("Введите код доступа к UFFLSCORE:");
            if(pwd === "4774") {
                state.isAdmin = true;
                save();
            } else if (pwd !== null) {
                alert("Неверный код!");
            }
        }

        function applyAdminUI() {
            const adminEls = document.querySelectorAll('.admin-el');
            adminEls.forEach(el => el.style.display = state.isAdmin ? 'block' : 'none');
            document.getElementById('admin-badge').style.display = state.isAdmin ? 'block' : 'none';
        }

        // НАВИГАЦИЯ
        function nav(tab) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            
            ['matches', 'standings', 'scorers', 'clubs'].forEach(id => {
                const btn = document.getElementById(`nv-${id}`);
                btn.classList.remove('nav-item-active');
                btn.classList.add('text-gray-500');
            });
            const activeBtn = document.getElementById(`nv-${tab}`);
            activeBtn.classList.add('nav-item-active');
            activeBtn.classList.remove('text-gray-500');
        }

        // ТУРЫ И МАТЧИ
        function renderTours() {
            const container = document.getElementById('tours-list-container');
            if(state.tours.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 text-xs py-10 italic">Матчей пока нет</div>`;
                return;
            }

            container.innerHTML = state.tours.map((tour, tIndex) => `
                <div class="bg-[#161925] rounded-xl border border-white/5 overflow-hidden shadow-md">
                    <div class="bg-[#11131c] p-3 flex justify-between items-center border-b border-cyan-500/20">
                        <h3 class="font-black text-cyan-400 text-[11px] uppercase tracking-wider">${tour.name}</h3>
                        <button onclick="createNewMatch(${tIndex})" class="hidden admin-el bg-cyan-600 hover:bg-cyan-500 text-white text-[9px] font-bold px-2 py-1 rounded transition">+ МАТЧ</button>
                    </div>
                    <div class="p-2 space-y-2">
                        ${tour.matches.length > 0 ? tour.matches.map((m, mIndex) => `
                            <div class="neon-card p-3 flex justify-between items-center">
                                <span class="font-bold text-[10px] w-[40%] text-right truncate text-gray-300">${m.home}</span>
                                <span class="font-black text-sm w-[20%] text-center ${m.status==='LIVE'?'text-red-500':(m.status==='FT'?'text-cyan-400':'text-gray-500')}">
                                    ${m.status === 'UPC' ? 'VS' : `${m.hScore} - ${m.aScore}`}
                                </span>
                                <span class="font-bold text-[10px] w-[40%] text-left truncate text-gray-300">${m.away}</span>
                            </div>
                        `).join('') : '<p class="text-[9px] text-gray-500 text-center py-2">Матчи не назначены</p>'}
                    </div>
                </div>
            `).join('');
            
            // Re-apply admin UI to new elements
            applyAdminUI();
        }

        function createNewTour() {
            if(!state.isAdmin) return;
            const name = prompt("Название тура (например: 1 ТУР):");
            if(name) {
                state.tours.push({ name: name, matches: [] });
                save();
            }
        }

        function createNewMatch(tourIndex) {
            if(!state.isAdmin) return;
            const teamsList = Object.keys(state.teams);
            if(teamsList.length < 2) return alert("Для создания матча нужно минимум 2 клуба!");
            
            const home = prompt(`Команда хозяев:\nДоступно: ${teamsList.join(', ')}`);
            if(!home || !state.teams[home]) return;
            
            const away = prompt(`Команда гостей:\nДоступно: ${teamsList.join(', ')}`);
            if(!away || !state.teams[away] || home === away) return;
            
            state.tours[tourIndex].matches.push({
                home: home, away: away, hScore: 0, aScore: 0, status: 'UPC', events: []
            });
            save();
        }

        // КЛУБЫ
        function createNewClub() {
            if(!state.isAdmin) return;
            const n = prompt("Название нового клуба:");
            if(n && !state.teams[n]) { 
                state.teams[n] = {logo: '', stadium: 'Не указан', capacity: '0', players: []}; 
                save(); 
            } else if (state.teams[n]) {
                alert("Клуб уже существует!");
            }
        }

        function renderClubs() {
            document.getElementById('clubs-list').innerHTML = Object.entries(state.teams).map(([name, info]) => `
                <div class="neon-card p-5 flex items-center gap-4 hover:scale-[1.02] transition">
                    <div class="w-14 h-14 rounded-2xl bg-[#111] bg-cover bg-center border-2 border-cyan-500/50 shadow-[0_0_15px_rgba(0,243,255,0.2)]"></div>
                    <div class="flex-1"><h3 class="font-black text-sm uppercase truncate">${name}</h3><p class="text-[10px] text-cyan-400 font-bold mt-1">${info.stadium}</p></div>
                </div>
            `).join('');
        }

        // ТАБЛИЦА
        function renderStandings() {
            let table = {}; 
            for(let t in state.teams) table[t] = { p: 0, gf: 0, ga: 0, pts: 0 };
            
            state.tours.forEach(tour => {
                tour.matches.forEach(m => {
                    if(!table[m.home] || !table[m.away] || m.status === 'UPC') return;
                    table[m.home].p++; table[m.away].p++;
                    table[m.home].gf += parseInt(m.hScore); table[m.home].ga += parseInt(m.aScore);
                    table[m.away].gf += parseInt(m.aScore); table[m.away].ga += parseInt(m.hScore);
                    if(m.hScore > m.aScore) table[m.home].pts += 3; 
                    else if(m.hScore < m.aScore) table[m.away].pts += 3; 
                    else { table[m.home].pts += 1; table[m.away].pts += 1; }
                });
            });

            const sorted = Object.entries(table).sort((a,b) => b[1].pts - a[1].pts);
            document.getElementById('standings-body').innerHTML = sorted.map(([n, d], i) => `
                <tr class="border-b border-white/5 hover:bg-white/5 transition">
                    <td class="py-4 px-2 font-bold text-gray-500">${i+1}</td>
                    <td class="font-bold truncate max-w-[120px]">${n}</td>
                    <td class="text-center">${d.p}</td>
                    <td class="text-center text-gray-400">${d.gf}:${d.ga}</td>
                    <td class="text-center font-black text-cyan-400 text-sm">${d.pts}</td>
                </tr>
            `).join('');
        }

        // БОМБАРДИРЫ
        function renderScorers() {
            let p = []; 
            for(let t in state.teams) state.teams[t].players.forEach(pl => p.push({...pl, t}));
            p.sort((a,b) => b.g - a.g);
            
            document.getElementById('scorers-list').innerHTML = p.slice(0, 20).map(x => `
                <div class="neon-card p-4 flex justify-between text-xs font-bold items-center hover:scale-[1.02] transition">
                    <span>${x.name} <span class="text-[9px] text-gray-500 block">${x.t}</span></span>
                    <span class="text-cyan-400 font-black text-lg">${x.g} <span class="text-xs opacity-70">⚽</span></span>
                </div>
            `).join('') || '<p class="text-[9px] text-gray-500 text-center">Нет данных</p>';
        }
    </script>
</body>
</html>
