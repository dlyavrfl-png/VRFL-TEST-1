<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SofaScore Ultra v6.0 NEON</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --sofa-blue: #374DF5; --sofa-bg: #F2F5F7; --pitch-green: #4C9142; --neon-accent: #00E676; }
        body { background: var(--sofa-bg); font-family: 'Inter', sans-serif; overflow-x: hidden; margin: 0; }
        
        /* АНИМАЦИЯ ЗАГРУЗКИ (1.5 СЕКУНДЫ) */
        #splash { position: fixed; inset: 0; background: var(--sofa-blue); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s ease; }
        .loader-ring { width: 80px; height: 80px; border: 5px solid rgba(255,255,255,0.1); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; box-shadow: 0 0 15px rgba(255,255,255,0.2); }
        @keyframes spin { to { transform: rotate(360deg); } }

        .active-tab { border-bottom: 3px solid white; color: white !important; }
        .nav-item-active { color: var(--sofa-blue) !important; font-weight: 800; }
        
        /* Поле */
        .pitch { background: #4C9142; background-image: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px), linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 40px 40px; border-radius: 12px; position: relative; border: 2px solid rgba(255,255,255,0.2); }
        .player-node { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; cursor: pointer; z-index: 10; }
        .p-circle { width: 34px; height: 34px; border-radius: 50%; border: 2px solid white; background: #fff; overflow: hidden; display: flex; align-items: center; justify-content: center; background-size: cover; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .p-rating { background: #1A9D54; color: white; font-size: 8px; font-weight: 900; padding: 1px 4px; border-radius: 4px; margin-top: -10px; z-index: 20; border: 1px solid rgba(0,0,0,0.1); box-shadow: 0 0 8px rgba(26, 157, 84, 0.5); }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; padding: 15px; }
        
        /* НЕОНОВЫЕ ЭФФЕКТЫ */
        .neon-border { border: 1px solid rgba(55, 77, 245, 0.4); box-shadow: 0 0 10px rgba(55, 77, 245, 0.1); }
        .neon-card { background: #1A1A1A; color: white; border-radius: 16px; border-left: 4px solid var(--neon-accent); }
    </style>
</head>
<body class="pb-24">

    <div id="splash">
        <div class="loader-ring mb-4"></div>
        <h1 class="text-white font-black tracking-tighter text-2xl italic">SOFASCORE IFCL</h1>
        <p class="text-blue-200 text-[10px] uppercase font-bold tracking-widest mt-2">Professional Edition 2026</p>
    </div>

    <div id="main-header" class="bg-[#374DF5] p-4 pt-10 text-white flex justify-between items-center shadow-lg">
        <h1 class="font-black text-xl italic tracking-tighter">SOFASCORE</h1>
        <div class="flex gap-4">
            <button onclick="requestAdmin()"><svg class="w-6 h-6 opacity-50" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg></button>
        </div>
    </div>

    <div id="view-matches" class="p-3 space-y-4">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100">
            <div class="bg-gray-50/50 p-3 flex items-center justify-between border-b">
                <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest">International Friendly Cup</span>
            </div>
            <div id="match-list-container"></div>
        </div>
    </div>

    <div id="view-standings" class="p-3 hidden">
        <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
            <h2 class="font-black text-sm uppercase mb-4 flex items-center gap-2"><span class="w-1 h-4 bg-blue-600"></span>Таблица LIVE</h2>
            <table class="w-full text-left text-[11px]">
                <thead class="text-gray-400 border-b">
                    <tr><th class="pb-2">#</th><th class="pb-2">КЛУБ</th><th class="pb-2">И</th><th class="pb-2">Г</th><th class="pb-2">О</th></tr>
                </thead>
                <tbody id="standings-body"></tbody>
            </table>
        </div>
    </div>

    <div id="view-scorers" class="p-3 hidden">
        <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
            <h2 class="font-black text-sm uppercase mb-4">Топ Бомбардиров</h2>
            <div id="scorers-list" class="space-y-4"></div>
        </div>
    </div>

    <div id="view-clubs" class="p-3 hidden">
        <div id="clubs-list" class="space-y-4"></div>
    </div>

    <div id="match-page" class="fixed inset-0 bg-[#F2F5F7] z-[1500] hidden overflow-y-auto">
        <div class="bg-[#1A1A1A] p-5 pt-12 text-white">
            <div class="flex justify-between items-center mb-8">
                <button onclick="closeMatch()"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
                <div class="text-[10px] font-bold text-gray-500 uppercase tracking-tighter italic">Match Details</div>
                <div class="w-6"></div>
            </div>
            <div class="flex justify-around items-center mb-8">
                <div class="text-center w-1/3" onclick="openClubDetails(curM().home)">
                    <div id="m-home-logo" onclick="changeLogo('home')" class="w-16 h-16 mx-auto bg-white rounded-full bg-cover border-4 border-white/5 mb-2"></div>
                    <div id="m-home-name" class="text-[10px] font-black uppercase"></div>
                </div>
                <div class="text-center w-1/3">
                    <div id="m-score" class="text-5xl font-black italic tracking-tighter text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.3)]">0-0</div>
                    <div id="m-status" class="text-[9px] font-black uppercase bg-red-600 px-2 py-0.5 rounded inline-block mt-2">LIVE</div>
                </div>
                <div class="text-center w-1/3" onclick="openClubDetails(curM().away)">
                    <div id="m-away-logo" onclick="changeLogo('away')" class="w-16 h-16 mx-auto bg-white rounded-full bg-cover border-4 border-white/5 mb-2"></div>
                    <div id="m-away-name" class="text-[10px] font-black uppercase"></div>
                </div>
            </div>
            <div class="flex justify-between border-t border-white/10 text-[10px] font-black uppercase overflow-x-auto">
                <button onclick="mTab('det')" id="mt-det" class="p-4 active-tab">Детали</button>
                <button onclick="mTab('line')" id="mt-line" class="p-4 text-gray-500">Составы</button>
                <button onclick="mTab('stat')" id="mt-stat" class="p-4 text-gray-500">Статистика</button>
                <button onclick="mTab('adm')" id="mt-adm" class="p-4 text-red-500 hidden">Админ</button>
            </div>
        </div>

        <div class="p-3" id="match-content">
            <div id="mview-det" class="bg-white rounded-xl p-5 shadow-sm space-y-4"></div>
            <div id="mview-line" class="hidden">
                <div class="pitch w-full h-[480px] shadow-2xl mb-4">
                    <div id="pitch-players"></div>
                </div>
            </div>
            <div id="mview-stat" class="hidden bg-white rounded-xl p-6 shadow-sm space-y-6"></div>
            <div id="mview-adm" class="hidden bg-red-50 p-5 rounded-xl border-2 border-red-100 space-y-4">
                <div class="grid grid-cols-2 gap-2">
                    <input id="as-h" type="number" class="p-3 border rounded font-black text-center" placeholder="Дома">
                    <input id="as-a" type="number" class="p-3 border rounded font-black text-center" placeholder="Гости">
                </div>
                <div class="flex gap-2">
                    <input id="ae-m" type="number" class="w-1/4 p-3 border rounded" placeholder="Мин.">
                    <input id="ae-t" type="text" class="w-3/4 p-3 border rounded" placeholder="Событие...">
                </div>
                <button onclick="saveAdminMatch()" class="w-full bg-blue-600 text-white p-4 rounded-xl font-bold uppercase text-xs">Обновить данные</button>
                <div class="space-y-4 pt-4 border-t border-red-200">
                    <div><label class="text-[9px] font-bold uppercase">Владение (%)</label><input id="as-poss" type="range" class="w-full"></div>
                    <div><label class="text-[9px] font-bold uppercase">xG (Дома/Гости)</label>
                        <div class="flex gap-2"><input id="as-xgh" step="0.1" type="number" class="w-1/2 p-2 border rounded"><input id="as-xga" step="0.1" type="number" class="w-1/2 p-2 border rounded"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="player-modal" class="modal">
        <div class="bg-white w-full max-w-sm rounded-3xl overflow-hidden shadow-2xl">
            <div id="pm-header" class="p-6 bg-[#1A1A1A] text-white flex items-center gap-4">
                <div class="w-16 h-16 rounded-full bg-gray-200 bg-cover border-2 border-white neon-border" id="pm-photo"></div>
                <div><h3 id="pm-name" class="font-black text-xl"></h3><p id="pm-team" class="text-xs text-blue-500 font-bold uppercase italic">Professional Player</p></div>
            </div>
            <div class="p-6 space-y-4">
                <div id="player-stats-grid" class="grid grid-cols-3 gap-2">
                    </div>
                
                <div id="pm-adm" class="hidden space-y-2 pt-4 border-t">
                    <div class="grid grid-cols-3 gap-2">
                        <input id="ai-r" type="number" step="0.1" class="col-span-3 p-2 border rounded text-xs" placeholder="Рейтинг">
                        <input id="ai-g" type="number" class="p-2 border rounded text-xs" placeholder="Голы">
                        <input id="ai-a" type="number" class="p-2 border rounded text-xs" placeholder="Асс">
                        <input id="ai-s" type="number" class="p-2 border rounded text-xs" placeholder="Удары">
                        <input id="ai-st" type="number" class="p-2 border rounded text-xs" placeholder="В ств">
                        <input id="ai-t" type="number" class="p-2 border rounded text-xs" placeholder="Отб">
                    </div>
                    <button onclick="savePlayerData()" class="w-full bg-red-600 text-white p-3 rounded-xl font-bold uppercase text-[10px]">Сохранить данные</button>
                </div>
                <button onclick="document.getElementById('player-modal').style.display='none'" class="w-full bg-gray-100 p-3 rounded-xl font-bold text-[10px] uppercase">Закрыть</button>
            </div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-4 z-[1000] shadow-2xl">
        <button onclick="nav('matches')" id="nv-matches" class="flex flex-col items-center gap-1 nav-item-active"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg><span class="text-[8px] uppercase font-black">Матчи</span></button>
        <button onclick="nav('standings')" id="nv-standings" class="flex flex-col items-center gap-1 text-gray-400"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg><span class="text-[8px] uppercase font-black">Таблица</span></button>
        <button onclick="nav('scorers')" id="nv-scorers" class="flex flex-col items-center gap-1 text-gray-400"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg><span class="text-[8px] uppercase font-black">Топ</span></button>
        <button onclick="nav('clubs')" id="nv-clubs" class="flex flex-col items-center gap-1 text-gray-400"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span class="text-[8px] uppercase font-black">Клубы</span></button>
    </div>

    <input type="file" id="img-input" class="hidden" accept="image/*">

    <script>
        // ТВОЙ ОРИГИНАЛЬНЫЙ STATE + НОВЫЕ ПОЛЯ
        let state = JSON.parse(localStorage.getItem('sofa_v7_data')) || {
            isAdmin: false,
            teams: {
                'Meridian Greenwich': { logo: '', stadium: 'London Stadium', capacity: '20,000', players: [
                    {id: 1, name: 'Niko', r: 8.5, g: 12, a: 5, s: 24, st: 12, t: 3, pos: {t: '15%', l: '50%'}},
                    {id: 2, name: 'Acsor', r: 7.2, g: 2, a: 8, s: 10, st: 4, t: 25, pos: {t: '30%', l: '30%'}},
                    {id: 3, name: 'Kelf', r: 7.9, g: 4, a: 1, s: 15, st: 7, t: 12, pos: {t: '30%', l: '70%'}}
                ]},
                'Lions': { logo: '', stadium: 'Lion Arena', capacity: '15,000', players: [
                    {id: 4, name: 'Mels', r: 7.0, g: 8, a: 3, s: 20, st: 10, t: 4, pos: {t: '85%', l: '50%'}}
                ]},
                'Phoenix': { logo: '', stadium: 'Fire Dome', capacity: '12,000', players: [
                    {id: 5, name: 'Rise', r: 7.5, g: 3, a: 4, s: 12, st: 6, t: 15, pos: {t: '50%', l: '50%'}}
                ]}
            },
            matches: [
                {id: 1, home: 'Meridian Greenwich', away: 'Lions', hScore: 2, aScore: 1, status: 'LIVE', events: [{min: 12, txt: 'Niko забивает с пенальти!'}], stats: {poss: 55, xgh: 1.2, xga: 0.8, shots: 10, target: 4}}
            ]
        };

        // ТВОЙ ТАЙМЕР ЗАГРУЗКИ (ИЗМЕНЕН НА 1.5 СЕКУНДЫ)
        setTimeout(() => { 
            document.getElementById('splash').style.opacity = '0'; 
            setTimeout(() => document.getElementById('splash').remove(), 800); 
        }, 1500);

        function save() { localStorage.setItem('sofa_v7_data', JSON.stringify(state)); }

        // ТВОЯ НАВИГАЦИЯ
        function nav(v) {
            ['matches', 'standings', 'scorers', 'clubs'].forEach(x => {
                document.getElementById('view-'+x).classList.add('hidden');
                document.getElementById('nv-'+x).classList.remove('nav-item-active');
                document.getElementById('nv-'+x).classList.add('text-gray-400');
            });
            document.getElementById('view-'+v).classList.remove('hidden');
            document.getElementById('nv-'+v).classList.add('nav-item-active');
            if(v === 'matches') renderMatches();
            if(v === 'standings') renderStandings();
            if(v === 'scorers') renderScorers();
            if(v === 'clubs') renderClubs();
        }

        // ТВОЙ РЕНДЕР МАТЧЕЙ
        function renderMatches() {
            const container = document.getElementById('match-list-container');
            container.innerHTML = state.matches.map(m => `
                <div onclick="openMatch(${m.id})" class="p-4 border-b active:bg-gray-50 flex justify-between items-center">
                    <div class="w-12 flex flex-col"><span class="text-[10px] font-bold text-gray-400">16:45</span><span class="text-[9px] font-black ${m.status === 'LIVE' ? 'text-red-500' : ''}">${m.status}</span></div>
                    <div class="flex-1 space-y-1">
                        <div class="flex items-center gap-2"><div class="w-4 h-4 rounded-full border bg-cover" style="background-image:url('${state.teams[m.home].logo}')"></div><span class="text-xs font-bold text-slate-800">${m.home}</span></div>
                        <div class="flex items-center gap-2"><div class="w-4 h-4 rounded-full border bg-cover" style="background-image:url('${state.teams[m.away].logo}')"></div><span class="text-xs font-bold text-slate-800">${m.away}</span></div>
                    </div>
                    <div class="flex flex-col items-end font-black text-sm text-slate-900"><span>${m.hScore}</span><span>${m.aScore}</span></div>
                </div>
            `).join('');
        }

        let activeMid = null;
        const curM = () => state.matches.find(x => x.id === activeMid);

        function openMatch(id) {
            activeMid = id;
            document.getElementById('match-page').classList.remove('hidden');
            mTab('det');
        }

        function closeMatch() { document.getElementById('match-page').classList.add('hidden'); activeMid = null; }

        function mTab(t) {
            ['det', 'line', 'stat', 'adm'].forEach(x => {
                document.getElementById('mview-'+x).classList.add('hidden');
                document.getElementById('mt-'+x).classList.remove('active-tab');
                document.getElementById('mt-'+x).classList.add('text-gray-500');
            });
            document.getElementById('mview-'+t).classList.remove('hidden');
            document.getElementById('mt-'+t).classList.add('active-tab');
            document.getElementById('mt-'+t).classList.remove('text-gray-500');
            renderMatchInfo();
        }

        function renderMatchInfo() {
            const m = curM();
            document.getElementById('m-home-name').innerText = m.home;
            document.getElementById('m-away-name').innerText = m.away;
            document.getElementById('m-score').innerText = `${m.hScore}-${m.aScore}`;
            document.getElementById('m-home-logo').style.backgroundImage = `url('${state.teams[m.home].logo}')`;
            document.getElementById('m-away-logo').style.backgroundImage = `url('${state.teams[m.away].logo}')`;
            if(state.isAdmin) document.getElementById('mt-adm').classList.remove('hidden');

            document.getElementById('mview-det').innerHTML = m.events.length ? m.events.map(e => `
                <div class="flex gap-4 items-start"><span class="font-black text-xs w-6">${e.min}'</span><span class="text-xs text-slate-600">${e.txt}</span></div>
            `).join('') : '<p class="text-xs text-gray-400 italic text-center">Ожидание событий...</p>';

            const pArea = document.getElementById('pitch-players');
            pArea.innerHTML = '';
            [...state.teams[m.home].players, ...state.teams[m.away].players].forEach(p => {
                const div = document.createElement('div');
                div.className = 'player-node';
                div.style.top = p.pos.t; div.style.left = p.pos.l;
                div.onclick = (e) => { e.stopPropagation(); openPlayer(p.id); };
                div.innerHTML = `<div class="p-circle"></div><div class="p-rating">${p.r.toFixed(1)}</div><span class="text-[8px] font-black text-white mt-1 drop-shadow-md">${p.name}</span>`;
                pArea.appendChild(div);
            });

            document.getElementById('mview-stat').innerHTML = `
                <div class="space-y-4">
                    ${statBar("Владение", m.stats.poss)}
                    <div class="flex justify-between font-black text-[10px] uppercase"><span>${m.stats.xgh}</span><span>Ожидаемые голы (xG)</span><span>${m.stats.xga}</span></div>
                </div>
            `;
        }

        function statBar(label, val) {
            return `
                <div class="space-y-1">
                    <div class="flex justify-between text-[10px] font-black uppercase"><span class="text-emerald-500">${val}%</span><span>${label}</span><span class="text-blue-500">${100-val}%</span></div>
                    <div class="h-1.5 w-full bg-gray-100 rounded-full flex overflow-hidden"><div style="width:${val}%" class="bg-emerald-500"></div><div style="width:${100-val}%" class="bg-blue-500"></div></div>
                </div>
            `;
        }

        // ТВОЯ АДМИНКА МАТЧА
        function saveAdminMatch() {
            const m = curM();
            m.hScore = document.getElementById('as-h').value || m.hScore;
            m.aScore = document.getElementById('as-a').value || m.aScore;
            const min = document.getElementById('ae-m').value;
            const txt = document.getElementById('ae-t').value;
            if(min && txt) m.events.push({min, txt});
            m.stats.poss = document.getElementById('as-poss').value;
            m.stats.xgh = document.getElementById('as-xgh').value || m.stats.xgh;
            m.stats.xga = document.getElementById('as-xga').value || m.stats.xga;
            save(); renderMatchInfo();
        }

        // ОТКРЫТИЕ ИГРОКА С НЕОНОВЫМИ СТАТАМИ
        let activePid = null;
        function openPlayer(id) {
            activePid = id;
            let p; for(let t in state.teams) { let f = state.teams[t].players.find(x => x.id === id); if(f) { p = f; break; } }
            document.getElementById('pm-name').innerText = p.name;
            
            const stats = [
                {l:'Рейтинг', v:p.r.toFixed(1), c:'text-emerald-500'}, {l:'Голы', v:p.g, c:'text-slate-800'}, {l:'Асс', v:p.a, c:'text-slate-800'},
                {l:'Удары', v:p.s || 0, c:'text-slate-800'}, {l:'В ств', v:p.st || 0, c:'text-slate-800'}, {l:'Отб', v:p.t || 0, c:'text-slate-800'}
            ];
            
            document.getElementById('player-stats-grid').innerHTML = stats.map(s => `
                <div class="bg-gray-50 p-2 rounded-xl text-center neon-border">
                    <p class="text-[7px] text-gray-400 font-bold uppercase">${s.l}</p>
                    <p class="font-black text-xs ${s.c}">${s.v}</p>
                </div>
            `).join('');

            if(state.isAdmin) document.getElementById('pm-adm').classList.remove('hidden');
            document.getElementById('player-modal').style.display = 'flex';
        }

        function savePlayerData() {
            let p; for(let t in state.teams) { let f = state.teams[t].players.find(x => x.id === activePid); if(f) { p = f; break; } }
            p.r = parseFloat(document.getElementById('ai-r').value) || p.r;
            p.g = parseInt(document.getElementById('ai-g').value) || p.g;
            p.a = parseInt(document.getElementById('ai-a').value) || p.a;
            p.s = parseInt(document.getElementById('ai-s').value) || p.s;
            p.st = parseInt(document.getElementById('ai-st').value) || p.st;
            p.t = parseInt(document.getElementById('ai-t').value) || p.t;
            save(); renderMatchInfo(); document.getElementById('player-modal').style.display='none';
        }

        // ВСЁ ОСТАЛЬНОЕ ПО ТВОЕМУ КОДУ
        function renderStandings() {
            let table = {};
            for(let t in state.teams) table[t] = { p: 0, gf: 0, ga: 0, pts: 0 };
            state.matches.forEach(m => {
                table[m.home].p++; table[m.away].p++;
                table[m.home].gf += parseInt(m.hScore); table[m.home].ga += parseInt(m.aScore);
                table[m.away].gf += parseInt(m.aScore); table[m.away].ga += parseInt(m.hScore);
                if(m.hScore > m.aScore) table[m.home].pts += 3;
                else if(m.hScore < m.aScore) table[m.away].pts += 3;
                else { table[m.home].pts += 1; table[m.away].pts += 1; }
            });
            const sorted = Object.entries(table).sort((a,b) => b[1].pts - a[1].pts);
            document.getElementById('standings-body').innerHTML = sorted.map(([n, d], i) => `
                <tr class="border-b"><td class="py-3 font-bold">${i+1}</td><td class="font-bold">${n}</td><td>${d.p}</td><td>${d.gf}:${d.ga}</td><td class="font-black">${d.pts}</td></tr>
            `).join('');
        }

        function renderScorers() {
            let p = []; for(let t in state.teams) state.teams[t].players.forEach(pl => p.push({...pl, t}));
            p.sort((a,b) => b.g - a.g);
            document.getElementById('scorers-list').innerHTML = p.map(x => `<div class="flex justify-between text-xs font-bold"><span>${x.name} (${x.t})</span><span class="text-blue-600">${x.g} голов</span></div>`).join('');
        }

        function renderClubs() {
            document.getElementById('clubs-list').innerHTML = Object.entries(state.teams).map(([name, info]) => `
                <div class="neon-card p-4 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-white bg-cover" style="background-image:url('${info.logo}')"></div>
                    <div><h3 class="font-black text-sm uppercase">${name}</h3><p class="text-[9px] text-blue-400 font-bold">${info.stadium}</p></div>
                </div>
            `).join('');
        }

        function requestAdmin() { if(prompt("Pass:") === "1234") { state.isAdmin = true; save(); location.reload(); } }

        function changeLogo(side) {
            if(!state.isAdmin) return;
            const m = curM(); const team = side === 'home' ? m.home : m.away;
            const inp = document.getElementById('img-input');
            inp.onchange = e => {
                const reader = new FileReader();
                reader.onload = () => { state.teams[team].logo = reader.result; save(); renderMatchInfo(); };
                reader.readAsDataURL(e.target.files[0]);
            };
            inp.click();
        }

        renderMatches();
    </script>
</body>
</html>
