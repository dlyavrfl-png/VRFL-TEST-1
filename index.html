<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FC Mobile Telegram Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Премиальный, минималистичный UI (стиль UEFA / Premier League) */
        :root {
            --bg-color: #0b0e14;
            --panel-bg: #151a25;
            --accent-color: #00ff87; /* Неоновый акцент как в FC */
            --text-main: #ffffff;
            --text-muted: #8a94a6;
            --border-radius: 12px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--tg-theme-bg-color, var(--bg-color));
            color: var(--tg-theme-text-color, var(--text-main));
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 20px;
            background: linear-gradient(180deg, rgba(21,26,37,1) 0%, rgba(11,14,20,0) 100%);
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .screen {
            display: none;
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .card {
            background-color: var(--panel-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card:active {
            transform: scale(0.95);
        }

        .card h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }

        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            margin-top: 20px;
        }

        .btn:active {
            opacity: 0.8;
        }

        /* Список команд */
        .team-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            padding: 15px;
            border-radius: var(--border-radius);
            border-left: 4px solid transparent;
        }

        .team-row[data-ovr^="8"] { border-left-color: #eab308; } /* Золотые команды */
        .team-row[data-ovr^="9"] { border-left-color: var(--accent-color); } /* Элита */

        .team-info { display: flex; flex-direction: column; }
        .team-name { font-weight: bold; font-size: 16px; }
        .team-stats { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .team-ovr { font-size: 20px; font-weight: bold; background: #2a3143; padding: 5px 10px; border-radius: 6px; }

        /* Симулятор матча */
        .match-scoreboard {
            background: var(--panel-bg);
            padding: 30px 20px;
            border-radius: var(--border-radius);
            text-align: center;
            margin-bottom: 20px;
        }

        .score-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 32px;
            font-weight: 900;
            margin: 20px 0;
        }

        .match-events {
            flex: 1;
            background: rgba(0,0,0,0.2);
            border-radius: var(--border-radius);
            padding: 15px;
            font-size: 14px;
            overflow-y: auto;
            max-height: 200px;
        }

        .event { margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; }
        .event-time { color: var(--accent-color); font-weight: bold; margin-right: 10px; }

    </style>
</head>
<body>

<div class="app-container">
    <header>TG FC 26</header>

    <div id="main-menu" class="screen active">
        <h2>Режимы игры</h2>
        <div class="menu-grid">
            <div class="card" onclick="navTo('career')">
                <h3>Карьера</h3>
                <span style="color: var(--text-muted); font-size: 12px;">Сезон 25/26</span>
            </div>
            <div class="card" onclick="navTo('quick-match')">
                <h3>Быстрый матч</h3>
                <span style="color: var(--text-muted); font-size: 12px;">Симуляция</span>
            </div>
            <div class="card" onclick="navTo('rosters')">
                <h3>Команды</h3>
                <span style="color: var(--text-muted); font-size: 12px;">База данных</span>
            </div>
            <div class="card">
                <h3>Настройки</h3>
                <span style="color: var(--text-muted); font-size: 12px;">Профиль</span>
            </div>
        </div>
    </div>

    <div id="rosters" class="screen">
        <h2>База клубов</h2>
        <div class="team-list" id="team-container">
            </div>
        <button class="btn" onclick="navTo('main-menu')">Назад в меню</button>
    </div>

    <div id="quick-match" class="screen">
        <h2>Симуляция матча</h2>
        <div class="match-scoreboard">
            <div class="score-display">
                <div id="home-team-name">Команда 1</div>
                <div><span id="home-score">0</span> - <span id="away-score">0</span></div>
                <div id="away-team-name">Команда 2</div>
            </div>
            <div id="match-timer" style="color: var(--accent-color); font-weight: bold;">0'</div>
        </div>
        <div class="match-events" id="event-log">
            <div style="color: var(--text-muted); text-align: center;">Матч еще не начался</div>
        </div>
        <button class="btn" id="start-match-btn" onclick="startMatch()">Начать матч</button>
        <button class="btn" style="background: var(--panel-bg); color: white;" onclick="navTo('main-menu')">Назад</button>
    </div>

    <div id="career" class="screen">
        <h2>Моя Карьера</h2>
        <div class="card" style="text-align: left; margin-bottom: 20px;">
            <h3>Текущий клуб: FC Lissabonsk</h3>
            <p style="color: var(--text-muted); font-size: 14px;">Бюджет: €125,000,000<br>Схема: 3-4-3</p>
        </div>
        <button class="btn" onclick="navTo('quick-match')">Следующий матч</button>
        <button class="btn" style="background: var(--panel-bg); color: white;" onclick="navTo('main-menu')">Назад</button>
    </div>

</div>

<script>
    // Инициализация Telegram Mini App
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();

    // База данных: 10 Команд
    const dbTeams = [
        { id: 1, name: "FC Lissabonsk", ovr: 86, att: 88, mid: 85, def: 84, tactic: "3-4-3" },
        { id: 2, name: "FC Dragons", ovr: 83, att: 84, mid: 82, def: 81, tactic: "3-4-3" },
        { id: 3, name: "Manchester City", ovr: 89, att: 89, mid: 90, def: 87, tactic: "4-3-3" },
        { id: 4, name: "Real Madrid", ovr: 88, att: 90, mid: 88, def: 85, tactic: "4-3-3" },
        { id: 5, name: "Arsenal", ovr: 85, att: 86, mid: 86, def: 84, tactic: "4-3-3" },
        { id: 6, name: "Bayern Munich", ovr: 87, att: 88, mid: 86, def: 86, tactic: "4-2-3-1" },
        { id: 7, name: "Inter Milan", ovr: 86, att: 85, mid: 85, def: 88, tactic: "3-5-2" },
        { id: 8, name: "Paris SG", ovr: 86, att: 89, mid: 84, def: 83, tactic: "4-3-3" },
        { id: 9, name: "Barcelona", ovr: 85, att: 85, mid: 87, def: 83, tactic: "4-3-3" },
        { id: 10, name: "Juventus", ovr: 84, att: 83, mid: 84, def: 85, tactic: "3-5-2" }
    ];

    // Навигация UI
    function navTo(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        if(screenId === 'rosters') renderTeams();
    }

    // Рендер команд
    function renderTeams() {
        const container = document.getElementById('team-container');
        container.innerHTML = '';
        dbTeams.forEach(team => {
            container.innerHTML += `
                <div class="team-row" data-ovr="${team.ovr}">
                    <div class="team-info">
                        <div class="team-name">${team.name}</div>
                        <div class="team-stats">АТК: ${team.att} | ПЗЩ: ${team.mid} | ЗЩТ: ${team.def}</div>
                    </div>
                    <div class="team-ovr">${team.ovr}</div>
                </div>
            `;
        });
    }

    // Движок симуляции матча
    let matchInterval;
    function startMatch() {
        const home = dbTeams[0]; // FC Lissabonsk
        const away = dbTeams[3]; // Real Madrid
        
        document.getElementById('home-team-name').innerText = home.name;
        document.getElementById('away-team-name').innerText = away.name;
        document.getElementById('home-score').innerText = '0';
        document.getElementById('away-score').innerText = '0';
        
        const log = document.getElementById('event-log');
        log.innerHTML = '';
        document.getElementById('start-match-btn').style.display = 'none';

        let minute = 0;
        let homeGoals = 0;
        let awayGoals = 0;

        matchInterval = setInterval(() => {
            minute += Math.floor(Math.random() * 5) + 1; // Скачки по 1-5 минут
            if (minute >= 90) {
                clearInterval(matchInterval);
                document.getElementById('match-timer').innerText = 'FT';
                logEvent(log, '90', 'Финальный свисток. Матч окончен.');
                document.getElementById('start-match-btn').style.display = 'block';
                document.getElementById('start-match-btn').innerText = 'Играть снова';
                return;
            }

            document.getElementById('match-timer').innerText = minute + "'";

            // Логика вероятностей
            let eventChance = Math.random() * 100;
            
            // Расчет преимущества (очень базовая формула для примера)
            let homeAdvantage = (home.att - away.def) + (home.mid - away.mid) / 2;
            let awayAdvantage = (away.att - home.def) + (away.mid - home.mid) / 2;

            if (eventChance < 8 + (homeAdvantage * 0.2)) {
                homeGoals++;
                document.getElementById('home-score').innerText = homeGoals;
                logEvent(log, minute, `ГОЛ! ${home.name} забивает шикарный мяч!`);
            } else if (eventChance > 92 - (awayAdvantage * 0.2)) {
                awayGoals++;
                document.getElementById('away-score').innerText = awayGoals;
                logEvent(log, minute, `ГОЛ! ${away.name} прорывает оборону!`);
            } else if (eventChance > 45 && eventChance < 50) {
                logEvent(log, minute, `${home.name} опасно атакует, но вратарь на месте.`);
            } else if (eventChance > 50 && eventChance < 55) {
                logEvent(log, minute, `Жесткий фол в центре поля. Тактическая борьба.`);
            }

        }, 300); // Скорость симуляции (300мс = 1 игровой шаг)
    }

    function logEvent(container, minute, text) {
        const el = document.createElement('div');
        el.className = 'event';
        el.innerHTML = `<span class="event-time">${minute}'</span> ${text}`;
        container.prepend(el); // Новые события сверху
    }

</script>
</body>
</html>
