<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SofaClone Pro - Meridian Greenwich</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f0f2f5; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        .rating-gold { background: #187bcd; } /* 9+ */
        .rating-green { background: #1a9d54; } /* 7-8 */
        .rating-orange { background: #f08022; } /* <7 */
        .tab-active { border-bottom: 3px solid #374df5; color: #374df5; }
        .admin-panel { display: none; }
    </style>
</head>
<body class="pb-20">

    <div class="bg-white p-6 shadow-sm flex justify-between items-center border-b">
        <div class="flex flex-col items-center w-1/3">
            <div class="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold text-xl mb-1">MG</div>
            <span class="text-xs font-bold text-center">Meridian Greenwich</span>
        </div>
        <div class="text-center">
            <div class="text-green-600 text-xs font-bold mb-1">LIVE</div>
            <div id="main-score" class="text-4xl font-black text-blue-700">0 - 0</div>
        </div>
        <div class="flex flex-col items-center w-1/3">
            <div class="w-12 h-12 bg-red-800 rounded-full flex items-center justify-center text-white font-bold text-xl mb-1">FD</div>
            <span class="text-xs font-bold text-center">FC Dedushki</span>
        </div>
    </div>

    <div class="flex bg-white border-b sticky top-0 z-10">
        <button onclick="showTab('match')" class="flex-1 py-3 text-sm font-bold text-gray-500 tab-btn tab-active" id="btn-match">МАТЧ</button>
        <button onclick="showTab('table')" class="flex-1 py-3 text-sm font-bold text-gray-500 tab-btn" id="btn-table">ТАБЛИЦА</button>
        <button onclick="showTab('stats')" class="flex-1 py-3 text-sm font-bold text-gray-500 tab-btn" id="btn-stats">БОМБАРДИРЫ</button>
        <button onclick="showTab('admin')" class="flex-1 py-3 text-sm font-bold text-red-500 tab-btn" id="btn-admin">АДМИН</button>
    </div>

    <div id="tab-match" class="p-4 space-y-4">
        <div class="bg-white rounded-xl shadow-sm p-4">
            <h3 class="font-bold text-gray-800 mb-3 border-b pb-2">СОСТАВ И ОЦЕНКИ</h3>
            <div id="lineup-list" class="space-y-3">
                </div>
        </div>
    </div>

    <div id="tab-table" class="hidden p-4">
        <div class="bg-white rounded-xl shadow-sm overflow-hidden">
            <table class="w-full text-left text-sm">
                <thead class="bg-gray-50 text-gray-500">
                    <tr>
                        <th class="p-3">#</th>
                        <th class="p-3">Команда</th>
                        <th class="p-3">И</th>
                        <th class="p-3">О</th>
                    </tr>
                </thead>
                <tbody id="league-table">
                    </tbody>
            </table>
        </div>
    </div>

    <div id="tab-stats" class="hidden p-4">
        <div class="bg-white rounded-xl shadow-sm p-4">
            <h3 class="font-bold mb-3">ТОП БОМБАРДИРОВ</h3>
            <div id="scorers-list" class="space-y-3"></div>
        </div>
    </div>

    <div id="tab-admin" class="hidden p-4 space-y-4">
        <div class="bg-red-50 border-2 border-red-200 rounded-xl p-4">
            <h3 class="font-bold text-red-700 mb-4 text-center">ПАНЕЛЬ УПРАВЛЕНИЯ</h3>
            
            <div class="space-y-3">
                <label class="block text-xs font-bold">СЧЁТ МАТЧА</label>
                <div class="flex gap-2">
                    <input id="in-score-h" type="number" class="w-1/2 p-2 border rounded" placeholder="MG">
                    <input id="in-score-a" type="number" class="w-1/2 p-2 border rounded" placeholder="Соперник">
                </div>
                
                <label class="block text-xs font-bold mt-4">ОБНОВИТЬ ИГРОКА (Имя | Оценка | Голы)</label>
                <select id="select-player" class="w-full p-2 border rounded mb-2"></select>
                <div class="flex gap-2">
                    <input id="in-rating" type="number" step="0.1" class="w-1/2 p-2 border rounded" placeholder="Оценка">
                    <input id="in-goals" type="number" class="w-1/2 p-2 border rounded" placeholder="Голы">
                </div>
                
                <button onclick="saveAdminData()" class="w-full bg-red-600 text-white font-bold py-3 rounded-lg mt-4 shadow-lg active:scale-95 transition">СОХРАНИТЬ ВСЁ</button>
                <button onclick="resetData()" class="w-full text-red-400 text-xs mt-4 underline">Сбросить всё к чертям</button>
            </div>
        </div>
    </div>

    <script>
        // ДАННЫЕ ПО УМОЛЧАНИЮ (Если localStorage пуст)
        const defaultData = {
            score: "0 - 0",
            players: [
                { id: 0, name: "Acsor", number: 1, rating: 7.0, goals: 0 },
                { id: 1, name: "Mels", number: 9, rating: 7.0, goals: 0 },
                { id: 2, name: "Niko", number: 10, rating: 7.0, goals: 0 },
                { id: 3, name: "Kelf", number: 19, rating: 7.0, goals: 0 },
                { id: 4, name: "Alex", number: 4, rating: 7.0, goals: 0 }
            ],
            teams: [
                { name: "Meridian Greenwich", games: 1, points: 3 },
                { name: "FC Dedushki", games: 1, points: 0 },
                { name: "Arbuz FC", games: 0, points: 0 }
            ]
        };

        let appData = JSON.parse(localStorage.getItem('sofaData')) || defaultData;

        function init() {
            renderAll();
            populateAdminSelect();
        }

        function renderAll() {
            // Score
            document.getElementById('main-score').innerText = appData.score;

            // Lineup
            const lineup = document.getElementById('lineup-list');
            lineup.innerHTML = '';
            appData.players.forEach(p => {
                let color = p.rating >= 9 ? 'rating-gold' : (p.rating >= 7 ? 'rating-green' : 'rating-orange');
                lineup.innerHTML += `
                    <div class="flex justify-between items-center p-2 bg-gray-50 rounded-lg">
                        <div class="flex items-center gap-3">
                            <span class="text-xs text-gray-400 w-4">${p.number}</span>
                            <span class="font-bold text-gray-700">${p.name} ${p.goals > 0 ? '⚽'.repeat(p.goals) : ''}</span>
                        </div>
                        <div class="text-white px-2 py-1 rounded text-sm font-black ${color}">${p.rating.toFixed(1)}</div>
                    </div>
                `;
            });

            // Table
            const tableBody = document.getElementById('league-table');
            tableBody.innerHTML = '';
            appData.teams.sort((a,b) => b.points - a.points).forEach((t, i) => {
                tableBody.innerHTML += `
                    <tr class="border-b">
                        <td class="p-3 font-bold text-gray-400">${i+1}</td>
                        <td class="p-3 font-bold">${t.name}</td>
                        <td class="p-3">${t.games}</td>
                        <td class="p-3 font-black text-blue-600">${t.points}</td>
                    </tr>
                `;
            });

            // Scorers
            const scorers = document.getElementById('scorers-list');
            scorers.innerHTML = '';
            appData.players.filter(p => p.goals > 0).sort((a,b) => b.goals - a.goals).forEach(p => {
                scorers.innerHTML += `
                    <div class="flex justify-between border-b pb-2">
                        <span>${p.name}</span>
                        <span class="font-bold">${p.goals}</span>
                    </div>
                `;
            });
            
            localStorage.setItem('sofaData', JSON.stringify(appData));
        }

        function showTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
            document.getElementById('btn-' + tab).classList.add('tab-active');
            
            ['match', 'table', 'stats', 'admin'].forEach(t => {
                document.getElementById('tab-' + t).classList.add('hidden');
            });
            document.getElementById('tab-' + tab).classList.remove('hidden');
        }

        function populateAdminSelect() {
            const select = document.getElementById('select-player');
            select.innerHTML = appData.players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
        }

        function saveAdminData() {
            const h = document.getElementById('in-score-h').value;
            const a = document.getElementById('in-score-a').value;
            if(h !== "" && a !== "") appData.score = `${h} - ${a}`;

            const pId = document.getElementById('select-player').value;
            const pRating = document.getElementById('in-rating').value;
            const pGoals = document.getElementById('in-goals').value;

            if(pRating !== "") appData.players[pId].rating = parseFloat(pRating);
            if(pGoals !== "") appData.players[pId].goals = parseInt(pGoals);

            renderAll();
            alert("Данные обновлены!");
        }

        function resetData() {
            if(confirm("Удалить всё?")) {
                localStorage.removeItem('sofaData');
                location.reload();
            }
        }

        init();
    </script>
</body>
    </html>
