<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SofaScore Neon Pro v7.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --neon-blue: #374DF5; --neon-green: #00E676; --dark-bg: #0C0F14; --card-bg: #161B22; }
        body { background: var(--dark-bg); color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        /* Стилизация под Sofascore */
        .neon-border { border: 1px solid rgba(55, 77, 245, 0.3); box-shadow: 0 0 15px rgba(55, 77, 245, 0.1); }
        .stat-badge { background: linear-gradient(135deg, #1A9D54 0%, #00E676 100%); }
        
        /* Анимация загрузки */
        #splash { position: fixed; inset: 0; background: var(--dark-bg); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.5s ease; }
        .neon-load { width: 50px; height: 50px; border: 3px solid var(--neon-blue); border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; filter: drop-shadow(0 0 10px var(--neon-blue)); }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Поле */
        .pitch-v7 { background: #1a221a; background-image: repeating-linear-gradient(90deg, transparent, transparent 49px, rgba(255,255,255,0.02) 50px); border-radius: 20px; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .player-v7 { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .p-img { width: 32px; height: 32px; border-radius: 50%; background: #2d333b; border: 2px solid var(--neon-blue); box-shadow: 0 0 10px rgba(55, 77, 245, 0.5); }
        
        .modal-v7 { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; overflow-y: auto; backdrop-filter: blur(10px); }
        .tab-btn.active { color: var(--neon-blue); border-bottom: 2px solid var(--neon-blue); font-weight: 900; }
    </style>
</head>
<body class="pb-24">

    <div id="splash">
        <div class="neon-load mb-4"></div>
        <h1 class="text-2xl font-black italic tracking-tighter text-white">SOFA<span class="text-blue-500">SCORE</span></h1>
        <div class="text-[9px] uppercase tracking-[0.3em] text-gray-500 mt-2">IFCL Official Engine</div>
    </div>

    <div class="p-6 pt-12 flex justify-between items-center bg-[#11161D]">
        <div>
            <h2 class="text-gray-400 text-[10px] font-bold uppercase tracking-widest">Kokshetau, Kazakhstan</h2>
            <h1 class="text-xl font-black italic">IFCL PREMIER</h1>
        </div>
        <button onclick="requestAdmin()" class="w-10 h-10 rounded-full bg-blue-600/10 flex items-center justify-center border border-blue-500/30">
            <svg class="w-5 h-5 text-blue-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>
        </button>
    </div>

    <div class="flex p-2 bg-[#11161D] sticky top-0 z-40 border-b border-white/5 overflow-x-auto whitespace-nowrap scrollbar-hide">
        <button onclick="nav('matches')" id="n-matches" class="tab-btn active px-6 py-3 text-[10px] uppercase font-bold">Матчи</button>
        <button onclick="nav('standings')" id="n-standings" class="tab-btn px-6 py-3 text-[10px] uppercase font-bold text-gray-500">Таблица</button>
        <button onclick="nav('scorers')" id="n-scorers" class="tab-btn px-6 py-3 text-[10px] uppercase font-bold text-gray-500">Топ игроков</button>
    </div>

    <div id="v-matches" class="p-4 space-y-4"></div>
    <div id="v-standings" class="p-4 hidden">
        <div class="bg-[#161B22] rounded-2xl p-4 border border-white/5">
            <table class="w-full text-left text-xs">
                <tr class="text-gray-500 uppercase text-[9px] font-black border-b border-white/5"><th class="pb-3">#</th><th class="pb-3">Клуб</th><th class="pb-3">О</th></tr>
                <tbody id="standings-list"></tbody>
            </table>
        </div>
    </div>
    <div id="v-scorers" class="p-4 hidden space-y-3" id="scorers-list"></div>

    <div id="club-modal" class="modal-v7">
        <div class="p-6 pt-12">
            <button onclick="closeClub()" class="mb-6 text-gray-500"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
            <div class="flex items-center gap-6 mb-8">
                <div id="c-logo" class="w-24 h-24 rounded-3xl bg-[#1C2128] border border-white/10 bg-cover shadow-2xl"></div>
                <div>
                    <h1 id="c-name" class="text-3xl font-black tracking-tighter"></h1>
                    <p id="c-stadium" class="text-blue-500 text-xs font-bold uppercase"></p>
                </div>
            </div>
            
            <div class="grid grid-cols-3 gap-2 mb-8">
                <div class="bg-[#1C2128] p-4 rounded-2xl text-center"><p class="text-[9px] text-gray-500 font-bold uppercase">Место</p><p id="c-rank" class="text-xl font-black"></p></div>
                <div class="bg-[#1C2128] p-4 rounded-2xl text-center"><p class="text-[9px] text-gray-500 font-bold uppercase">Очки</p><p id="c-pts" class="text-xl font-black text-blue-500"></p></div>
                <div class="bg-[#1C2128] p-4 rounded-2xl text-center"><p class="text-[9px] text-gray-500 font-bold uppercase">Игры</p><p id="c-pld" class="text-xl font-black"></p></div>
            </div>

            <h3 class="text-[10px] font-black text-gray-500 uppercase mb-4 tracking-widest">Лидеры команды</h3>
            <div id="c-leaders" class="space-y-2 mb-8"></div>

            <h3 class="text-[10px] font-black text-gray-500 uppercase mb-4 tracking-widest">Последние матчи</h3>
            <div id="c-history" class="space-y-2"></div>
        </div>
    </div>

    <div id="player-modal" class="modal-v7">
        <div class="p-6 flex flex-col items-center">
            <div class="w-20 h-20 rounded-full border-2 border-blue-500 mb-4 bg-[#2d333b]"></div>
            <h2 id="pm-name" class="text-2xl font-black mb-6"></h2>
            
            <div id="pm-stats-grid" class="grid grid-cols-2 gap-3 w-full mb-8">
                </div>

            <div id="pm-adm-panel" class="hidden w-full bg-red-600/10 border border-red-500/20 p-4 rounded-2xl space-y-4">
                <h4 class="text-red-500 font-black text-[10px] uppercase">Admin: Edit Stats</h4>
                <div class="grid grid-cols-2 gap-2">
                    <input id="ai-g" type="number" placeholder="Голы" class="bg-black/50 p-3 rounded-lg text-sm border border-white/5">
                    <input id="ai-a" type="number" placeholder="Ассисты" class="bg-black/50 p-3 rounded-lg text-sm border border-white/5">
                    <input id="ai-s" type="number" placeholder="Удары" class="bg-black/50 p-3 rounded-lg text-sm border border-white/5">
                    <input id="ai-t" type="number" placeholder="Отборы" class="bg-black/50 p-3 rounded-lg text-sm border border-white/5">
                    <input id="ai-y" type="number" placeholder="ЖК" class="bg-black/50 p-3 rounded-lg text-sm border border-white/5">
                    <input id="ai-r" type="number" placeholder="КК" class="bg-black/50 p-3 rounded-lg text-sm border border-white/5">
                    <input id="ai-rt" type="number" step="0.1" placeholder="Рейтинг" class="bg-black/50 p-3 rounded-lg text-sm border border-white/5 col-span-2">
                </div>
                <button onclick="savePlayerStats()" class="w-full bg-red-600 p-3 rounded-xl font-black text-xs uppercase">Обновить игрока</button>
            </div>
            <button onclick="document.getElementById('player-modal').style.display='none'" class="mt-6 text-gray-500 text-xs font-bold uppercase">Закрыть</button>
        </div>
    </div>

    <div id="match-page" class="fixed inset-0 bg-[#0C0F14] z-[4000] hidden overflow-y-auto">
        <div class="p-6 pt-12 bg-[#161B22] border-b border-white/5">
            <button onclick="closeMatch()" class="mb-8"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
            <div class="flex justify-between items-center text-center">
                <div class="w-1/3" onclick="openClub(curM().home)">
                    <div id="mh-logo" class="w-16 h-16 mx-auto bg-[#21262d] rounded-2xl bg-cover mb-2 border border-white/5"></div>
                    <p id="mh-name" class="text-[10px] font-black uppercase"></p>
                </div>
                <div class="w-1/3">
                    <div id="m-score" class="text-5xl font-black italic tracking-tighter mb-2"></div>
                    <div class="text-[9px] font-black text-red-500 bg-red-500/10 px-2 py-1 rounded inline">LIVE</div>
                </div>
                <div class="w-1/3" onclick="openClub(curM().away)">
                    <div id="ma-logo" class="w-16 h-16 mx-auto bg-[#21262d] rounded-2xl bg-cover mb-2 border border-white/5"></div>
                    <p id="ma-name" class="text-[10px] font-black uppercase"></p>
                </div>
            </div>
        </div>
        <div class="p-4">
             <div class="pitch-v7 w-full h-80 mb-6"><div id="pitch-layers"></div></div>
             <div id="m-timeline" class="space-y-4 bg-[#161B22] p-6 rounded-2xl border border-white/5"></div>
        </div>
    </div>

    <script>
        let state = JSON.parse(localStorage.getItem('sofa_v7_data')) || {
            isAdmin: false,
            teams: {
                'Meridian Greenwich': { logo: '', stadium: 'London Stadium', players: [
                    {id: 1, name: 'Niko', r: 8.5, g: 12, a: 5, s: 40, st: 20, t: 5, y: 1, rk: 0, pos: {t:'20%', l:'50%'}},
                    {id: 2, name: 'Acsor', r: 7.8, g: 2, a: 8, s: 15, st: 8, t: 25, y: 3, rk: 0, pos: {t:'40%', l:'30%'}},
                    {id: 3, name: 'Kelf', r: 8.1, g: 5, a: 1, s: 10, st: 4, t: 12, y: 0, rk: 0, pos: {t:'40%', l:'70%'}}
                ]},
                'Lions': { logo: '', stadium: 'Lion Arena', players: [
                    {id: 4, name: 'Mels', r: 7.5, g: 8, a: 2, s: 30, st: 12, t: 4, y: 2, rk: 0, pos: {t:'80%', l:'50%'}},
                    {id: 5, name: 'Alex', r: 6.9, g: 1, a: 0, s: 5, st: 2, t: 30, y: 4, rk: 1, pos: {t:'65%', l:'40%'}}
                ]},
                'Phoenix': { logo: '', stadium: 'Fire Dome', players: [
                    {id: 6, name: 'Vantuz', r: 7.2, g: 3, a: 4, s: 12, st: 6, t: 18, y: 1, rk: 0, pos: {t:'50%', l:'50%'}}
                ]}
            },
            matches: [
                {id: 1, home: 'Meridian Greenwich', away: 'Lions', hScore: 2, aScore: 1, status: 'LIVE', events: [{min:23, txt:'Niko Goal'}]}
            ]
        };

        const save = () => localStorage.setItem('sofa_v7_data', JSON.stringify(state));
        setTimeout(() => { document.getElementById('splash').style.opacity = '0'; setTimeout(()=>document.getElementById('splash').remove(), 500); }, 1500);

        function nav(t) {
            ['matches', 'standings', 'scorers'].forEach(x => {
                document.getElementById('v-'+x).classList.add('hidden');
                document.getElementById('n-'+x).classList.remove('active');
            });
            document.getElementById('v-'+t).classList.remove('hidden');
            document.getElementById('n-'+t).classList.add('active');
            if(t === 'matches') renderMatches();
            if(t === 'standings') renderStandings();
            if(t === 'scorers') renderScorers();
        }

        function renderMatches() {
            document.getElementById('v-matches').innerHTML = state.matches.map(m => `
                <div onclick="openMatch(${m.id})" class="bg-[#161B22] p-5 rounded-2xl border border-white/5 flex justify-between items-center shadow-lg">
                    <div class="text-[10px] font-black text-red-500 uppercase italic">Live</div>
                    <div class="flex-1 px-4 space-y-2">
                        <div class="flex items-center gap-3"><div class="w-5 h-5 rounded-md bg-cover" style="background-image:url('${state.teams[m.home].logo}')"></div><span class="text-xs font-bold">${m.home}</span></div>
                        <div class="flex items-center gap-3"><div class="w-5 h-5 rounded-md bg-cover" style="background-image:url('${state.teams[m.away].logo}')"></div><span class="text-xs font-bold">${m.away}</span></div>
                    </div>
                    <div class="text-right font-black text-xl italic tracking-tighter"><div>${m.hScore}</div><div>${m.aScore}</div></div>
                </div>
            `).join('');
        }

        let activeMid = null;
        const curM = () => state.matches.find(x => x.id === activeMid);

        function openMatch(id) {
            activeMid = id;
            const m = curM();
            document.getElementById('mh-name').innerText = m.home;
            document.getElementById('ma-name').innerText = m.away;
            document.getElementById('m-score').innerText = `${m.hScore}-${m.aScore}`;
            document.getElementById('mh-logo').style.backgroundImage = `url('${state.teams[m.home].logo}')`;
            document.getElementById('ma-logo').style.backgroundImage = `url('${state.teams[m.away].logo}')`;
            
            const pLayer = document.getElementById('pitch-layers');
            pLayer.innerHTML = '';
            [...state.teams[m.home].players, ...state.teams[m.away].players].forEach(p => {
                const d = document.createElement('div');
                d.className = 'player-v7'; d.style.top = p.pos.t; d.style.left = p.pos.l;
                d.onclick = (e) => { e.stopPropagation(); openPlayer(p.id); };
                d.innerHTML = `<div class="p-img"></div><div class="bg-emerald-500 text-[8px] px-1 rounded font-black mt-[-8px] z-10 border border-black/20">${p.r}</div><span class="text-[8px] font-bold mt-1">${p.name}</span>`;
                pLayer.appendChild(d);
            });
            document.getElementById('match-page').classList.remove('hidden');
        }

        function closeMatch() { document.getElementById('match-page').classList.add('hidden'); }

        // --- CLUB PROFILE ---
        function openClub(name) {
            const t = state.teams[name];
            document.getElementById('c-name').innerText = name;
            document.getElementById('c-stadium').innerText = t.stadium;
            document.getElementById('c-logo').style.backgroundImage = `url('${t.logo}')`;
            
            // Stats
            const hist = state.matches.filter(m => m.home === name || m.away === name);
            document.getElementById('c-pld').innerText = hist.length;
            document.getElementById('c-pts').innerText = hist.reduce((acc, m) => {
                const isHome = m.home === name;
                if(m.hScore === m.aScore) return acc + 1;
                if(isHome && m.hScore > m.aScore) return acc + 3;
                if(!isHome && m.aScore > m.hScore) return acc + 3;
                return acc;
            }, 0);
            
            // Leaders
            const top = [...t.players].sort((a,b) => b.g - a.g).slice(0,2);
            document.getElementById('c-leaders').innerHTML = top.map(p => `
                <div class="bg-[#1C2128] p-3 rounded-xl flex justify-between items-center">
                    <span class="text-xs font-bold">${p.name}</span>
                    <span class="text-xs font-black text-blue-500">${p.g} Голов / ${p.a} Асс.</span>
                </div>
            `).join('');

            document.getElementById('club-modal').style.display = 'block';
        }
        function closeClub() { document.getElementById('club-modal').style.display = 'none'; }

        // --- PLAYER ADMIN ---
        let activePid = null;
        function openPlayer(id) {
            activePid = id;
            let p; for(let t in state.teams) { let f = state.teams[t].players.find(x => x.id === id); if(f) p = f; }
            document.getElementById('pm-name').innerText = p.name;
            const stats = [
                {l:'Голы', v:p.g}, {l:'Ассисты', v:p.a}, {l:'Удары', v:p.s}, 
                {l:'В створ', v:p.st}, {l:'Отборы', v:p.t}, {l:'ЖК', v:p.y}
            ];
            document.getElementById('pm-stats-grid').innerHTML = stats.map(s => `
                <div class="bg-[#1C2128] p-3 rounded-xl text-center"><p class="text-[9px] text-gray-500 font-bold uppercase">${s.l}</p><p class="font-black">${s.v}</p></div>
            `).join('');
            
            if(state.isAdmin) document.getElementById('pm-adm-panel').classList.remove('hidden');
            document.getElementById('player-modal').style.display = 'flex';
        }

        function savePlayerStats() {
            let p; for(let t in state.teams) { let f = state.teams[t].players.find(x => x.id === activePid); if(f) p = f; }
            p.g = parseInt(document.getElementById('ai-g').value) || p.g;
            p.a = parseInt(document.getElementById('ai-a').value) || p.a;
            p.s = parseInt(document.getElementById('ai-s').value) || p.s;
            p.t = parseInt(document.getElementById('ai-t').value) || p.t;
            p.y = parseInt(document.getElementById('ai-y').value) || p.y;
            p.rk = parseInt(document.getElementById('ai-r').value) || p.rk;
            p.r = parseFloat(document.getElementById('ai-rt').value) || p.r;
            save(); openPlayer(activePid);
        }

        function requestAdmin() { if(prompt('Pass:') === '1234') { state.isAdmin = true; save(); location.reload(); } }

        nav('matches');
    </script>
</body>
</html>
