<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SofaScore Ultra v6.0 NEON</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --sofa-blue: #374DF5; 
            --sofa-bg: #0f111a; /* ТЕМНЫЙ ФОН */
            --pitch-green: #4C9142; 
            --neon-accent: #00E676; 
            --neon-blue: #00f3ff;
        }
        body { background: var(--sofa-bg); font-family: 'Inter', sans-serif; overflow-x: hidden; margin: 0; color: white; }
        
        /* АНИМАЦИЯ ЗАГРУЗКИ */
        #splash { position: fixed; inset: 0; background: var(--sofa-blue); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s ease; }
        .loader-ring { width: 80px; height: 80px; border: 5px solid rgba(255,255,255,0.1); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; box-shadow: 0 0 15px rgba(255,255,255,0.2); }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* НЕОНОВЫЕ КАРТОЧКИ */
        .neon-card { 
            background: #161925; 
            border: 1px solid rgba(0, 243, 255, 0.2); 
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.05);
            transition: 0.3s;
        }
        .neon-card:active { box-shadow: 0 0 20px var(--neon-blue); }
        .neon-text { text-shadow: 0 0 10px var(--neon-blue); color: #fff; }

        .active-tab { border-bottom: 3px solid var(--neon-blue); color: var(--neon-blue) !important; }
        .nav-item-active { color: var(--neon-blue) !important; font-weight: 800; text-shadow: 0 0 10px var(--neon-blue); }
        
        /* Поле */
        .pitch { background: #1a4a16; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 30px 30px; border-radius: 12px; position: relative; border: 2px solid rgba(255,255,255,0.2); }
        .player-node { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; cursor: pointer; z-index: 10; }
        .p-circle { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--neon-blue); background: #111; overflow: hidden; box-shadow: 0 0 10px var(--neon-blue); }
        .p-rating { background: #1A9D54; color: white; font-size: 8px; font-weight: 900; padding: 1px 4px; border-radius: 4px; margin-top: -10px; z-index: 20; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; padding: 15px; }
        
        /* СТИЛЬ ИНФЫ ИЗ СКРИНШОТА */
        .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
        .info-label { color: #888; font-weight: 500; }
        .info-value { color: #fff; font-weight: 700; }
        .market-value { color: #ffcc00; font-size: 18px; font-weight: 900; }
    </style>
</head>
<body class="pb-24">

    <div id="splash">
        <div class="loader-ring mb-4"></div>
        <h1 class="text-white font-black tracking-tighter text-2xl italic">SOFASCORE IFCL</h1>
        <p class="text-blue-200 text-[10px] uppercase font-bold tracking-widest mt-2">Professional Edition 2026</p>
    </div>

    <div id="main-header" class="bg-[#161925] p-4 pt-10 text-white flex justify-between items-center border-b border-blue-500/30 shadow-lg">
        <h1 class="font-black text-xl italic tracking-tighter neon-text">SOFASCORE</h1>
        <div class="flex gap-4">
            <button onclick="requestAdmin()"><svg class="w-6 h-6 opacity-50" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg></button>
        </div>
    </div>

    <div id="view-matches" class="p-3 space-y-4">
        <div class="bg-transparent rounded-xl">
            <div class="p-3 flex items-center justify-between">
                <span class="text-[10px] font-black text-blue-400 uppercase tracking-widest">International Friendly Cup</span>
            </div>
            <div id="match-list-container" class="space-y-3"></div>
        </div>
    </div>

    <div id="view-standings" class="p-3 hidden">
        <div class="neon-card rounded-xl p-4">
            <h2 class="font-black text-sm uppercase mb-4 flex items-center gap-2"><span class="w-1 h-4 bg-blue-600"></span>Таблица LIVE</h2>
            <table class="w-full text-left text-[11px]">
                <thead class="text-gray-400 border-b border-gray-800">
                    <tr><th class="pb-2">#</th><th class="pb-2">КЛУБ</th><th class="pb-2">И</th><th class="pb-2">Г</th><th class="pb-2">О</th></tr>
                </thead>
                <tbody id="standings-body"></tbody>
            </table>
        </div>
    </div>

    <div id="view-scorers" class="p-3 hidden">
        <div class="neon-card rounded-xl p-4">
            <h2 class="font-black text-sm uppercase mb-4">Топ Бомбардиров</h2>
            <div id="scorers-list" class="space-y-4"></div>
        </div>
    </div>

    <div id="view-clubs" class="p-3 hidden">
        <div id="clubs-list" class="space-y-4"></div>
    </div>

    <div id="club-page" class="fixed inset-0 bg-[#0f111a] z-[1600] hidden overflow-y-auto">
        <div class="p-5 pt-12">
            <button onclick="document.getElementById('club-page').classList.add('hidden')" class="mb-5 text-blue-400 font-bold flex items-center gap-2">← Назад</button>
            <div id="club-info-content"></div>
        </div>
    </div>

    <div id="match-page" class="fixed inset-0 bg-[#0f111a] z-[1500] hidden overflow-y-auto">
        <div class="bg-[#161925] p-5 pt-12 text-white border-b border-blue-500/20">
            <div class="flex justify-between items-center mb-8">
                <button onclick="closeMatch()"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
                <div class="text-[10px] font-bold text-gray-500 uppercase tracking-tighter italic">Match Details</div>
                <div class="w-6"></div>
            </div>
            <div class="flex justify-around items-center mb-8">
                <div class="text-center w-1/3" onclick="openClubDetails(curM().home)">
                    <div id="m-home-logo" class="w-16 h-16 mx-auto bg-gray-800 rounded-full bg-cover border-4 border-blue-500/20 mb-2"></div>
                    <div id="m-home-name" class="text-[10px] font-black uppercase"></div>
                </div>
                <div class="text-center w-1/3">
                    <div id="m-score" class="text-5xl font-black italic tracking-tighter neon-text">0-0</div>
                    <div id="m-status" class="text-[9px] font-black uppercase bg-red-600 px-2 py-0.5 rounded inline-block mt-2">LIVE</div>
                </div>
                <div class="text-center w-1/3" onclick="openClubDetails(curM().away)">
                    <div id="m-away-logo" class="w-16 h-16 mx-auto bg-gray-800 rounded-full bg-cover border-4 border-blue-500/20 mb-2"></div>
                    <div id="m-away-name" class="text-[10px] font-black uppercase"></div>
                </div>
            </div>
            <div class="flex justify-between border-t border-white/5 text-[10px] font-black uppercase overflow-x-auto">
                <button onclick="mTab('det')" id="mt-det" class="p-4 active-tab">Детали</button>
                <button onclick="mTab('line')" id="mt-line" class="p-4 text-gray-500">Составы</button>
                <button onclick="mTab('stat')" id="mt-stat" class="p-4 text-gray-500">Статистика</button>
                <button onclick="mTab('adm')" id="mt-adm" class="p-4 text-red-500 hidden">Админ</button>
            </div>
        </div>
        <div class="p-3" id="match-content">
            <div id="mview-det" class="neon-card rounded-xl p-5 space-y-4"></div>
            <div id="mview-line" class="hidden">
                <div class="pitch w-full h-[480px] shadow-2xl mb-4">
                    <div id="pitch-players"></div>
                </div>
            </div>
            <div id="mview-stat" class="hidden neon-card rounded-xl p-6 space-y-6"></div>
            <div id="mview-adm" class="hidden bg-red-900/20 p-5 rounded-xl border-2 border-red-500/50 space-y-4">
                <div class="grid grid-cols-2 gap-2">
                    <input id="as-h" type="number" class="p-3 bg-black border border-red-500 rounded font-black text-center text-white" placeholder="Дома">
                    <input id="as-a" type="number" class="p-3 bg-black border border-red-500 rounded font-black text-center text-white" placeholder="Гости">
                </div>
                <button onclick="saveAdminMatch()" class="w-full bg-red-600 text-white p-4 rounded-xl font-bold uppercase text-xs">Обновить данные</button>
            </div>
        </div>
    </div>

    <div id="player-modal" class="modal">
        <div class="bg-[#161925] w-full max-w-sm rounded-3xl overflow-hidden border border-blue-500/30 shadow-2xl">
            <div class="p-6 bg-gradient-to-b from-blue-900/40 to-transparent flex flex-col items-center">
                <div class="w-24 h-24 rounded-full bg-gray-800 bg-cover border-4 border-blue-500 mb-4" id="pm-photo"></div>
                <h3 id="pm-name" class="font-black text-2xl uppercase tracking-tighter"></h3>
                <p id="pm-team" class="text-blue-400 font-bold uppercase text-xs italic"></p>
            </div>
            <div class="p-6 pt-0">
                <div class="info-row"><span class="info-label">Гражданство</span><span class="info-value">Казахстан 🇰🇿</span></div>
                <div class="info-row"><span class="info-label">Возраст</span><span class="info-value">21 год</span></div>
                <div class="info-row"><span class="info-label">Позиция</span><span class="info-value">ЦП / АП</span></div>
                <div class="info-row"><span class="info-label">Рабочая нога</span><span class="info-value">Правая</span></div>
                <div class="info-row border-none mt-2"><span class="info-label">Рыночная стоимость</span><span class="market-value">85M €</span></div>
                
                <div id="pm-adm" class="hidden mt-4 p-4 border-t border-gray-800">
                    <input id="ai-r" type="number" step="0.1" class="w-full p-2 bg-black border border-red-500 rounded text-xs text-white" placeholder="Рейтинг">
                    <button onclick="savePlayerData()" class="w-full bg-red-600 text-white p-2 rounded mt-2 text-xs font-bold">ОБНОВИТЬ</button>
                </div>
                <button onclick="document.getElementById('player-modal').style.display='none'" class="w-full bg-gray-800 p-4 rounded-2xl font-black text-[10px] uppercase mt-4">Закрыть</button>
            </div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-[#161925] border-t border-blue-500/30 flex justify-around py-4 z-[1000]">
        <button onclick="nav('matches')" id="nv-matches" class="flex flex-col items-center gap-1 nav-item-active text-gray-500"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg><span class="text-[8px] uppercase font-black">Матчи</span></button>
        <button onclick="nav('standings')" id="nv-standings" class="flex flex-col items-center gap-1 text-gray-400"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg><span class="text-[8px] uppercase font-black">Таблица</span></button>
        <button onclick="nav('scorers')" id="nv-scorers" class="flex flex-col items-center gap-1 text-gray-400"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg><span class="text-[8px] uppercase font-black">Топ</span></button>
        <button onclick="nav('clubs')" id="nv-clubs" class="flex flex-col items-center gap-1 text-gray-400"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span class="text-[8px] uppercase font-black">Клубы</span></button>
    </div>

    <input type="file" id="img-input" class="hidden" accept="image/*">

    <script>
        let state = JSON.parse(localStorage.getItem('sofa_v7_data')) || {
            isAdmin: false,
            teams: {
                'Meridian Greenwich': { logo: '', stadium: 'London Stadium', capacity: '20,000', playerCount: 28, players: [
                    {id: 1, name: 'Niko', r: 8.5, g: 12, a: 5, pos: {t: '15%', l: '50%'}},
                    {id: 2, name: 'Acsor', r: 7.2, g: 2, a: 8, pos: {t: '30%', l: '30%'}},
                    {id: 3, name: 'Kelf', r: 7.9, g: 4, a: 1, pos: {t: '30%', l: '70%'}}
                ]},
                'Lions': { logo: '', stadium: 'Lion Arena', capacity: '15,000', playerCount: 24, players: [
                    {id: 4, name: 'Mels', r: 7.0, g: 8, a: 3, pos: {t: '85%', l: '50%'}}
                ]},
                'Phoenix': { logo: '', stadium: 'Fire Dome', capacity: '12,000', playerCount: 22, players: [
                    {id: 5, name: 'Rise', r: 7.5, g: 3, a: 4, pos: {t: '50%', l: '50%'}}
                ]}
            },
            matches: [
                {id: 1, home: 'Meridian Greenwich', away: 'Lions', hScore: 2, aScore: 1, status: 'LIVE', events: [{min: 12, txt: 'Niko забил!'}], stats: {poss: 55, xgh: 1.2, xga: 0.8}},
                {id: 2, home: 'Phoenix', away: 'Meridian Greenwich', hScore: 0, aScore: 3, status: 'FT', events: [], stats: {poss: 40, xgh: 0.5, xga: 2.1}},
                {id: 3, home: 'Lions', away: 'Phoenix', hScore: 1, aScore: 1, status: 'FT', events: [], stats: {poss: 50, xgh: 1.0, xga: 1.0}}
            ]
        };

        setTimeout(() => { document.getElementById('splash').style.opacity = '0'; setTimeout(() => document.getElementById('splash').remove(), 800); }, 1500);
        function save() { localStorage.setItem('sofa_v7_data', JSON.stringify(state)); }

        function nav(v) {
            ['matches', 'standings', 'scorers', 'clubs'].forEach(x => {
                document.getElementById('view-'+x).classList.add('hidden');
                document.getElementById('nv-'+x).classList.remove('nav-item-active');
            });
            document.getElementById('view-'+v).classList.remove('hidden');
            document.getElementById('nv-'+v).classList.add('nav-item-active');
            if(v === 'matches') renderMatches();
            if(v === 'standings') renderStandings();
            if(v === 'scorers') renderScorers();
            if(v === 'clubs') renderClubs();
        }

        function renderMatches() {
            document.getElementById('match-list-container').innerHTML = state.matches.map(m => `
                <div onclick="openMatch(${m.id})" class="neon-card p-4 rounded-xl flex justify-between items-center">
                    <div class="w-12 text-[9px] font-black ${m.status === 'LIVE' ? 'text-red-500' : 'text-gray-500'}">${m.status}</div>
                    <div class="flex-1 px-4">
                        <div class="flex items-center gap-2 mb-1"><div class="w-4 h-4 rounded-full bg-gray-700 bg-cover" style="background-image:url('${state.teams[m.home].logo}')"></div><span class="text-xs font-bold">${m.home}</span></div>
                        <div class="flex items-center gap-2"><div class="w-4 h-4 rounded-full bg-gray-700 bg-cover" style="background-image:url('${state.teams[m.away].logo}')"></div><span class="text-xs font-bold">${m.away}</span></div>
                    </div>
                    <div class="flex flex-col items-end font-black text-sm neon-text"><span>${m.hScore}</span><span>${m.aScore}</span></div>
                </div>
            `).join('');
        }

        let activeMid = null;
        const curM = () => state.matches.find(x => x.id === activeMid);

        function openMatch(id) { activeMid = id; document.getElementById('match-page').classList.remove('hidden'); mTab('det'); }
        function closeMatch() { document.getElementById('match-page').classList.add('hidden'); }

        function openClubDetails(teamName) {
            const team = state.teams[teamName];
            document.getElementById('club-page').classList.remove('hidden');
            document.getElementById('club-info-content').innerHTML = `
                <div class="flex flex-col items-center mb-8">
                    <div class="w-24 h-24 bg-gray-800 rounded-full mb-4 border-4 border-blue-500 shadow-[0_0_20px_rgba(0,243,255,0.3)] bg-cover" style="background-image:url('${team.logo}')"></div>
                    <h2 class="text-3xl font-black italic neon-text uppercase">${teamName}</h2>
                </div>
                <div class="space-y-4">
                    <div class="neon-card p-4 rounded-xl flex justify-between"><span>Стадион</span><span class="font-bold text-blue-400">${team.stadium}</span></div>
                    <div class="neon-card p-4 rounded-xl flex justify-between"><span>Вместимость</span><span class="font-bold text-blue-400">${team.capacity}</span></div>
                    <div class="neon-card p-4 rounded-xl flex justify-between"><span>Игроков в составе</span><span class="font-bold text-blue-400">${team.playerCount}</span></div>
                </div>
            `;
        }

        function mTab(t) {
            ['det', 'line', 'stat', 'adm'].forEach(x => { document.getElementById('mview-'+x).classList.add('hidden'); document.getElementById('mt-'+x).classList.remove('active-tab'); });
            document.getElementById('mview-'+t).classList.remove('hidden');
            document.getElementById('mt-'+t).classList.add('active-tab');
            renderMatchInfo();
        }

        function renderMatchInfo() {
            const m = curM();
            document.getElementById('m-home-name').innerText = m.home;
            document.getElementById('m-away-name').innerText = m.away;
            document.getElementById('m-score').innerText = `${m.hScore}-${m.aScore}`;
            document.getElementById('m-home-logo').style.backgroundImage = `url('${state.teams[m.home].logo}')`;
            document.getElementById('m-away-logo').style.backgroundImage = `url('${state.teams[m.away].logo}')`;
            if(state.isAdmin) document.getElementById('mt-adm').classList.remove('hidden');

            const pArea = document.getElementById('pitch-players');
            pArea.innerHTML = '';
            [...state.teams[m.home].players, ...state.teams[m.away].players].forEach(p => {
                const div = document.createElement('div');
                div.className = 'player-node';
                div.style.top = p.pos.t; div.style.left = p.pos.l;
                div.onclick = (e) => { e.stopPropagation(); openPlayer(p.id); };
                div.innerHTML = `<div class="p-circle" style="background-image:url('${p.photo || ''}')"></div><div class="p-rating">${p.r.toFixed(1)}</div><span class="text-[8px] font-black text-white mt-1 drop-shadow-md">${p.name}</span>`;
                pArea.appendChild(div);
            });
        }

        function openPlayer(id) {
            let p; for(let t in state.teams) { let f = state.teams[t].players.find(x => x.id === id); if(f) { p = f; p.team = t; break; } }
            document.getElementById('pm-name').innerText = p.name;
            document.getElementById('pm-team').innerText = p.team;
            if(state.isAdmin) document.getElementById('pm-adm').classList.remove('hidden');
            document.getElementById('player-modal').style.display = 'flex';
        }

        function renderStandings() {
            let table = {}; for(let t in state.teams) table[t] = { p: 0, gf: 0, ga: 0, pts: 0 };
            state.matches.forEach(m => {
                table[m.home].p++; table[m.away].p++;
                table[m.home].gf += parseInt(m.hScore); table[m.home].ga += parseInt(m.aScore);
                table[m.away].gf += parseInt(m.aScore); table[m.away].ga += parseInt(m.hScore);
                if(m.hScore > m.aScore) table[m.home].pts += 3;
                else if(m.hScore < m.aScore) table[m.away].pts += 3;
                else { table[m.home].pts += 1; table[m.away].pts += 1; }
            });
            const sorted = Object.entries(table).sort((a,b) => b[1].pts - a[1].pts);
            document.getElementById('standings-body').innerHTML = sorted.map(([n, d], i) => `
                <tr class="border-b border-gray-800"><td class="py-3 font-bold">${i+1}</td><td class="font-bold text-blue-400">${n}</td><td>${d.p}</td><td>${d.gf}:${d.ga}</td><td class="font-black neon-text">${d.pts}</td></tr>
            `).join('');
        }

        function renderClubs() {
            document.getElementById('clubs-list').innerHTML = Object.entries(state.teams).map(([name, info]) => `
                <div onclick="openClubDetails('${name}')" class="neon-card p-4 rounded-xl flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-gray-800 bg-cover" style="background-image:url('${info.logo}')"></div>
                    <div><h3 class="font-black text-sm uppercase">${name}</h3><p class="text-[9px] text-blue-400 font-bold">${info.playerCount} Игроков</p></div>
                </div>
            `).join('');
        }

        function requestAdmin() { if(prompt("Pass:") === "1234") { state.isAdmin = true; save(); location.reload(); } }
        renderMatches();
    </script>
</body>
</html>
