<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SofaScore Ultra v7.0 - PRO ADMIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --sofa-bg: #0f111a; --neon-accent: #00f3ff; }
        body { background: var(--sofa-bg); font-family: 'Inter', sans-serif; color: #fff; margin: 0; }
        
        .active-tab { border-bottom: 3px solid var(--neon-accent); color: var(--neon-accent) !important; text-shadow: 0 0 10px var(--neon-accent); }
        .nav-item-active { color: var(--neon-accent) !important; font-weight: 800; }
        
        .pitch { background: #1a4a16; background-image: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px), linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 40px 40px; border-radius: 12px; position: relative; border: 2px solid rgba(0,243,255,0.2); }
        .player-node { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; z-index: 10; }
        .p-circle { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); background: #111; background-size: cover; background-position: center; }
        
        /* Цвета рейтинга */
        .rate-high { background: #1A9D54 !important; } /* Зеленый */
        .rate-mid { background: #FFA500 !important; }  /* Оранжевый */
        .rate-low { background: #EF4444 !important; }  /* Красный */

        .p-rating { color: white; font-size: 8px; font-weight: 900; padding: 1px 4px; border-radius: 4px; margin-top: -10px; z-index: 20; border: 1px solid rgba(0,0,0,0.3); }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center; padding: 15px; }
        .neon-card { background: #161925; color: white; border-radius: 16px; border-left: 4px solid var(--neon-accent); }
        
        .admin-input { background: #0a0a0f; border: 1px solid var(--neon-accent); color: white; padding: 4px 8px; border-radius: 4px; width: 130px; text-align: right; }
        .upload-overlay { position: relative; cursor: pointer; }
        .upload-overlay::after { content: '📷'; position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.2s; border-radius: inherit; }
        .upload-overlay:hover::after { opacity: 1; }
    </style>
</head>
<body class="pb-24">

    <div class="bg-[#161925] p-4 pt-10 text-white flex justify-between items-center border-b border-cyan-500/30">
        <h1 class="font-black text-xl italic tracking-tighter">SOFASCORE <span class="text-cyan-400">PRO</span></h1>
        <div class="flex gap-4 items-center">
            <span id="admin-badge" class="hidden bg-red-600 text-white text-[9px] font-black px-2 py-1 rounded">ADMIN</span>
            <button onclick="requestAdmin()"><svg class="w-6 h-6 opacity-50" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg></button>
        </div>
    </div>

    <div id="view-matches" class="p-3 space-y-4">
        <div class="p-3 flex items-center justify-between">
            <span class="text-[10px] font-black text-cyan-500 uppercase tracking-widest">Текущие матчи</span>
            <button id="btn-add-match" onclick="createNewMatch()" class="hidden bg-cyan-600 text-white text-[9px] font-bold px-3 py-1.5 rounded-full uppercase">Новый матч +</button>
        </div>
        <div id="match-list-container" class="space-y-3"></div>
    </div>

    <div id="view-standings" class="p-3 hidden">
        <div class="neon-card p-4">
            <h2 class="font-black text-xs uppercase mb-4 text-cyan-400">Таблица лиги</h2>
            <table class="w-full text-left text-[11px]">
                <thead class="text-gray-500 border-b border-white/5">
                    <tr><th class="pb-2">#</th><th class="pb-2">КЛУБ</th><th class="pb-2 text-center">Очки</th></tr>
                </thead>
                <tbody id="standings-body"></tbody>
            </table>
        </div>
    </div>

    <div id="view-scorers" class="p-3 hidden">
        <div class="neon-card p-4">
            <h2 class="font-black text-xs uppercase mb-4 text-cyan-400">Бомбардиры</h2>
            <div id="scorers-list" class="space-y-3"></div>
        </div>
    </div>

    <div id="view-clubs" class="p-3 hidden">
        <div class="flex justify-between items-center mb-4 px-1">
            <span class="text-[10px] font-black text-gray-500 uppercase">Список команд</span>
            <button id="btn-add-club" onclick="createNewClub()" class="hidden bg-green-600 text-white text-[9px] font-bold px-3 py-1.5 rounded-full uppercase">Создать клуб +</button>
        </div>
        <div id="clubs-list" class="space-y-4"></div>
    </div>

    <div id="match-page" class="fixed inset-0 bg-[#0f111a] z-[1500] hidden overflow-y-auto">
        <div class="bg-[#161925] p-5 pt-12 border-b border-cyan-500/20 text-white">
            <button onclick="closeMatch()" class="mb-4"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
            <div class="flex justify-around items-center text-center">
                <div class="w-1/3" onclick="openClubPage(curM().home)"><div id="m-home-logo" class="w-16 h-16 mx-auto rounded-full bg-cover bg-center border-2 border-cyan-500 mb-2"></div><div id="m-home-name" class="text-[10px] font-black uppercase"></div></div>
                <div class="w-1/3"><div id="m-score" class="text-4xl font-black italic">0-0</div><div id="m-status" class="text-[9px] font-black uppercase bg-red-600 px-2 py-0.5 rounded inline-block mt-2">LIVE</div></div>
                <div class="w-1/3" onclick="openClubPage(curM().away)"><div id="m-away-logo" class="w-16 h-16 mx-auto rounded-full bg-cover bg-center border-2 border-cyan-500 mb-2"></div><div id="m-away-name" class="text-[10px] font-black uppercase"></div></div>
            </div>
            <div class="flex justify-between border-t border-white/5 mt-6 text-[10px] font-black uppercase">
                <button onclick="mTab('line')" id="mt-line" class="p-4 active-tab w-1/3">Составы</button>
                <button onclick="mTab('det')" id="mt-det" class="p-4 text-gray-500 w-1/3">События</button>
                <button onclick="mTab('adm')" id="mt-adm" class="p-4 text-red-500 hidden w-1/3">Админ</button>
            </div>
        </div>
        <div class="p-3" id="match-content">
            <div id="mview-line" class="pitch w-full h-[450px]"><div id="pitch-players"></div></div>
            <div id="mview-det" class="hidden neon-card p-4 space-y-3"></div>
            <div id="mview-adm" class="hidden bg-red-900/10 p-5 rounded-2xl border border-red-500/50 space-y-4">
                <div class="grid grid-cols-2 gap-2">
                    <input id="as-h" type="number" class="p-3 bg-black border border-red-500 rounded text-white text-center font-bold" placeholder="Дома">
                    <input id="as-a" type="number" class="p-3 bg-black border border-red-500 rounded text-white text-center font-bold" placeholder="Гости">
                </div>
                <select id="as-status" class="w-full p-3 bg-black border border-red-500 rounded text-white font-bold">
                    <option value="LIVE">LIVE</option><option value="FT">FT</option><option value="UPC">UPC</option>
                </select>
                <div class="flex gap-2 border-t border-red-500/20 pt-4">
                    <input id="ae-m" type="number" class="w-1/4 p-2 bg-black border border-red-500 rounded text-white" placeholder="Мин">
                    <input id="ae-t" type="text" class="w-3/4 p-2 bg-black border border-red-500 rounded text-white" placeholder="Текст события">
                </div>
                <button onclick="saveAdminMatch()" class="w-full bg-red-600 p-3 rounded-xl font-bold uppercase text-[10px]">Обновить матч</button>
            </div>
        </div>
    </div>

    <div id="club-page" class="fixed inset-0 bg-[#0f111a] z-[1400] hidden overflow-y-auto">
        <div class="bg-[#161925] p-5 pt-12 border-b border-cyan-500/20 text-white">
            <button onclick="closeClubPage()" class="mb-6"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
            <div class="flex flex-col items-center mb-6">
                <div id="cp-logo" class="w-24 h-24 rounded-full bg-cover bg-center border-4 border-cyan-500 shadow-xl mb-3 bg-black"></div>
                <h2 id="cp-name" class="text-2xl font-black uppercase tracking-tighter text-cyan-400"></h2>
            </div>
            <div class="flex justify-between border-t border-white/5 text-[10px] font-black uppercase">
                <button onclick="cTab('squad')" id="ct-squad" class="p-4 active-tab w-1/2">Состав</button>
                <button onclick="cTab('info')" id="ct-info" class="p-4 text-gray-500 w-1/2">Инфо</button>
            </div>
        </div>
        <div class="p-4">
            <div id="cview-squad" class="space-y-2"></div>
            <div id="cview-info" class="hidden space-y-3"></div>
            <button id="btn-add-player" onclick="addNewPlayer()" class="hidden w-full mt-4 bg-cyan-900/30 text-cyan-400 p-4 rounded-2xl border border-cyan-500/30 font-bold uppercase text-[10px]">Добавить игрока +</button>
        </div>
    </div>

    <div id="profile-modal" class="modal">
        <div class="bg-[#161925] w-full max-w-sm rounded-3xl overflow-hidden border border-cyan-500/30">
            <div class="p-6 bg-cyan-950/20 flex flex-col items-center">
                <div id="prof-photo" class="w-24 h-24 rounded-full bg-cover bg-center border-4 border-cyan-500 mb-4 bg-black"></div>
                <h3 id="prof-name-display" class="font-black text-xl uppercase text-white"></h3>
            </div>
            <div id="prof-edit-mode" class="p-6 space-y-3">
                <div class="flex justify-between items-center text-xs text-gray-400">Имя <input id="p-e-name" type="text" class="admin-input"></div>
                <div class="flex justify-between items-center text-xs text-gray-400">Гражданство <input id="p-e-cit" type="text" class="admin-input"></div>
                <div class="flex justify-between items-center text-xs text-gray-400">Рейтинг (ОБЩ) <input id="p-e-rating" type="text" class="admin-input"></div>
                <div class="flex justify-between items-center text-xs text-gray-400">Позиция <input id="p-e-pos" type="text" class="admin-input"></div>
                <div class="flex justify-between items-center text-xs text-gray-400">Стоимость <input id="p-e-val" type="text" class="admin-input"></div>
                <button onclick="savePlayerProfile()" class="w-full bg-red-600 p-3 rounded-xl font-bold uppercase text-[10px] text-white mt-2">Сохранить</button>
            </div>
            <div class="p-4"><button onclick="document.getElementById('profile-modal').style.display='none'" class="w-full bg-gray-800 p-3 rounded-xl font-bold text-[9px] uppercase text-white">Закрыть</button></div>
        </div>
    </div>

    <div id="player-modal" class="modal">
        <div class="bg-[#161925] w-full max-w-sm rounded-3xl p-6 border border-cyan-500/30">
            <div class="flex items-center gap-4 mb-6">
                <div id="pm-photo" class="w-14 h-14 rounded-full bg-cover bg-center border-2 border-cyan-500 bg-black"></div>
                <h3 id="pm-name" class="font-black text-lg text-white"></h3>
            </div>
            <div id="pm-adm" class="space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <input id="ai-r" step="0.1" type="number" class="p-2 bg-black border border-red-500 rounded text-white text-xs" placeholder="Рейтинг в матче">
                    <input id="ai-g" type="number" class="p-2 bg-black border border-red-500 rounded text-white text-xs" placeholder="Голы">
                </div>
                <div class="flex gap-2">
                    <input id="ai-pos-t" type="text" class="w-1/2 p-2 bg-black border border-red-500 rounded text-white text-xs" placeholder="Top %">
                    <input id="ai-pos-l" type="text" class="w-1/2 p-2 bg-black border border-red-500 rounded text-white text-xs" placeholder="Left %">
                </div>
                <button onclick="savePlayerData()" class="w-full bg-red-600 p-3 rounded-xl font-bold uppercase text-[10px] text-white">Сохранить данные</button>
            </div>
            <button onclick="document.getElementById('player-modal').style.display='none'" class="w-full bg-gray-800 p-3 rounded-xl font-bold text-[9px] uppercase text-white mt-4">Отмена</button>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-[#0a0a0f] border-t border-white/5 flex justify-around py-4 z-[1000]">
        <button onclick="nav('matches')" id="nv-matches" class="nav-item-active text-[9px] font-black uppercase">Матчи</button>
        <button onclick="nav('standings')" id="nv-standings" class="text-gray-500 text-[9px] font-black uppercase">Таблица</button>
        <button onclick="nav('scorers')" id="nv-scorers" class="text-gray-500 text-[9px] font-black uppercase">Топ</button>
        <button onclick="nav('clubs')" id="nv-clubs" class="text-gray-500 text-[9px] font-black uppercase">Клубы</button>
    </div>

    <input type="file" id="img-input" class="hidden" accept="image/*">

    <script>
        // ДАННЫЕ (ЧИСТЫЕ)
        let state = JSON.parse(localStorage.getItem('sofa_v10_clean')) || {
            isAdmin: false,
            teams: {},
            matches: []
        };

        function save() { localStorage.setItem('sofa_v10_clean', JSON.stringify(state)); applyAdminUI(); }

        // ЦВЕТ РЕЙТИНГА
        function getRateClass(val) {
            const r = parseFloat(val);
            if (r >= 7.0) return 'rate-high';
            if (r >= 6.0) return 'rate-mid';
            return 'rate-low';
        }

        // АДМИН
        function requestAdmin() {
            if(state.isAdmin) { if(confirm("Выйти?")) { state.isAdmin=false; save(); location.reload(); } return; }
            if(prompt("Пароль:") === "4774") { state.isAdmin=true; save(); location.reload(); }
        }

        function applyAdminUI() {
            const show = state.isAdmin ? 'remove' : 'add';
            ['admin-badge', 'btn-add-match', 'btn-add-club', 'btn-add-player', 'mt-adm'].forEach(id => {
                const el = document.getElementById(id);
                if(el) el.classList[show]('hidden');
            });
            document.getElementById('cp-logo').className = `w-24 h-24 rounded-full bg-cover bg-center border-4 border-cyan-500 shadow-xl mb-3 bg-black ${state.isAdmin ? 'upload-overlay' : ''}`;
            document.getElementById('prof-photo').className = `w-24 h-24 rounded-full bg-cover bg-center border-4 border-cyan-500 mb-4 bg-black ${state.isAdmin ? 'upload-overlay' : ''}`;
        }

        // ЗАГРУЗКА ФОТО
        function triggerImageUpload(cb) {
            if(!state.isAdmin) return;
            const inp = document.getElementById('img-input');
            inp.onchange = e => {
                const reader = new FileReader();
                reader.onload = () => cb(reader.result);
                if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
            };
            inp.click();
        }

        // НАВИГАЦИЯ
        function nav(v) {
            ['matches', 'standings', 'scorers', 'clubs'].forEach(x => {
                document.getElementById('view-'+x).classList.add('hidden');
                document.getElementById('nv-'+x).className = 'text-gray-500 text-[9px] font-black uppercase';
            });
            document.getElementById('view-'+v).classList.remove('hidden');
            document.getElementById('nv-'+v).className = 'nav-item-active text-[9px] font-black uppercase';
            if(v==='matches') renderMatches(); if(v==='standings') renderStandings(); if(v==='scorers') renderScorers(); if(v==='clubs') renderClubs();
        }

        // МАТЧИ
        function renderMatches() {
            document.getElementById('match-list-container').innerHTML = state.matches.length ? state.matches.map(m => `
                <div onclick="openMatch(${m.id})" class="neon-card p-4 flex justify-between items-center cursor-pointer">
                    <div class="flex-1 space-y-1">
                        <div class="flex items-center gap-2 text-xs font-bold"><div class="w-4 h-4 rounded-full bg-cover bg-center" style="background-image:url('${state.teams[m.home]?.logo || ''}')"></div>${m.home}</div>
                        <div class="flex items-center gap-2 text-xs font-bold"><div class="w-4 h-4 rounded-full bg-cover bg-center" style="background-image:url('${state.teams[m.away]?.logo || ''}')"></div>${m.away}</div>
                    </div>
                    <div class="text-right"><div class="font-black text-lg italic">${m.hScore}-${m.aScore}</div><div class="text-[8px] font-bold text-gray-500">${m.status}</div></div>
                </div>
            `).join('') : '<p class="text-center text-gray-600 text-[10px] py-10 uppercase">Нет запланированных матчей</p>';
        }

        function createNewClub() {
            const n = prompt("Название нового клуба:");
            if(n) { state.teams[n] = {logo: '', stadium: 'Default Stadium', capacity: '0', players: []}; save(); renderClubs(); }
        }

        let activeClub = null;
        function openClubPage(name) {
            activeClub = name; document.getElementById('club-page').classList.remove('hidden');
            document.getElementById('cp-name').innerText = name;
            const logo = document.getElementById('cp-logo'); logo.style.backgroundImage = `url('${state.teams[name].logo}')`;
            logo.onclick = () => triggerImageUpload(img => { state.teams[name].logo = img; save(); openClubPage(name); });
            cTab('squad');
        }
        function closeClubPage() { document.getElementById('club-page').classList.add('hidden'); activeClub = null; }

        function cTab(t) {
            ['squad', 'info'].forEach(x => { document.getElementById('cview-'+x).classList.add('hidden'); document.getElementById('ct-'+x).className = 'p-4 text-gray-500 w-1/2'; });
            document.getElementById('cview-'+t).classList.remove('hidden'); document.getElementById('ct-'+t).className = 'p-4 active-tab w-1/2';
            renderClubInfo();
        }

        function renderClubInfo() {
            const t = state.teams[activeClub];
            document.getElementById('cview-squad').innerHTML = t.players.map(p => `
                <div onclick="openProfileModal(${p.id})" class="bg-[#111] p-3 rounded-xl flex items-center justify-between border border-white/5">
                    <div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-cover bg-center" style="background-image:url('${p.img}')"></div><span class="text-xs font-bold">${p.name}</span></div>
                    <span class="text-[10px] font-black px-2 py-1 rounded ${getRateClass(p.prof.rating)}">${p.prof.rating}</span>
                </div>
            `).join('');
            document.getElementById('cview-info').innerHTML = `<div class="p-4 bg-gray-900 rounded-xl space-y-2 text-xs"><div>Стадион: ${t.stadium}</div><div>Вместимость: ${t.capacity}</div></div>`;
        }

        function addNewPlayer() {
            const n = prompt("Имя игрока:");
            if(n) { state.teams[activeClub].players.push({id: Date.now(), name: n, img: '', r: 6.0, g: 0, a: 0, pos: {t: '50%', l: '50%'}, prof: {cit: '-', rating: '6.0', pos: '-', val: '-'}}); save(); renderClubInfo(); }
        }

        // ПРОФИЛИ
        let activePid = null;
        function openProfileModal(id) {
            activePid = id; let p; for(let t in state.teams) { let f = state.teams[t].players.find(x => x.id === id); if(f) p = f; }
            document.getElementById('prof-name-display').innerText = p.name;
            const photo = document.getElementById('prof-photo'); photo.style.backgroundImage = `url('${p.img}')`;
            photo.onclick = () => triggerImageUpload(img => { p.img = img; save(); openProfileModal(id); });
            
            document.getElementById('p-e-name').value = p.name;
            document.getElementById('p-e-cit').value = p.prof.cit;
            document.getElementById('p-e-rating').value = p.prof.rating;
            document.getElementById('p-e-pos').value = p.prof.pos;
            document.getElementById('p-e-val').value = p.prof.val;
            document.getElementById('profile-modal').style.display = 'flex';
        }

        function savePlayerProfile() {
            let p; for(let t in state.teams) { let f = state.teams[t].players.find(x => x.id === activePid); if(f) p = f; }
            p.name = document.getElementById('p-e-name').value;
            p.prof.cit = document.getElementById('p-e-cit').value;
            p.prof.rating = document.getElementById('p-e-rating').value;
            p.prof.pos = document.getElementById('p-e-pos').value;
            p.prof.val = document.getElementById('p-e-val').value;
            save(); document.getElementById('profile-modal').style.display = 'none'; renderClubInfo();
        }

        let activePStatId = null;
        function openPlayerStats(id) {
            activePStatId = id; let p; for(let t in state.teams) { let f = state.teams[t].players.find(x => x.id === id); if(f) p = f; }
            document.getElementById('pm-name').innerText = p.name;
            document.getElementById('pm-photo').style.backgroundImage = `url('${p.img}')`;
            document.getElementById('ai-r').value = p.r; document.getElementById('ai-g').value = p.g;
            document.getElementById('ai-pos-t').value = p.pos.t; document.getElementById('ai-pos-l').value = p.pos.l;
            document.getElementById('player-modal').style.display = 'flex';
        }

        function savePlayerData() {
            let p; for(let t in state.teams) { let f = state.teams[t].players.find(x => x.id === activePStatId); if(f) p = f; }
            p.r = parseFloat(document.getElementById('ai-r').value); p.g = parseInt(document.getElementById('ai-g').value);
            p.pos.t = document.getElementById('ai-pos-t').value; p.pos.l = document.getElementById('ai-pos-l').value;
            save(); document.getElementById('player-modal').style.display='none'; renderMatchInfo();
        }

        function renderStandings() {
            let res = Object.keys(state.teams).map(n => {
                let pts = 0;
                state.matches.forEach(m => {
                    if(m.status !== 'FT') return;
                    if(m.home === n) pts += m.hScore > m.aScore ? 3 : (m.hScore === m.aScore ? 1 : 0);
                    if(m.away === n) pts += m.aScore > m.hScore ? 3 : (m.hScore === m.aScore ? 1 : 0);
                });
                return {n, pts};
            }).sort((a,b) => b.pts - a.pts);
            document.getElementById('standings-body').innerHTML = res.map((r, i) => `<tr><td class="py-3">${i+1}</td><td class="font-bold">${r.n}</td><td class="text-center font-black text-cyan-400">${r.pts}</td></tr>`).join('');
        }

        function renderScorers() {
            let list = []; for(let t in state.teams) state.teams[t].players.forEach(p => list.push({...p, tName: t}));
            list.sort((a,b) => b.g - a.g);
            document.getElementById('scorers-list').innerHTML = list.map(p => `<div class="flex justify-between items-center text-[11px] font-bold"><span>${p.name} <span class="text-gray-600 text-[8px]">(${p.tName})</span></span><span class="text-cyan-400">${p.g} ⚽</span></div>`).join('');
        }

        applyAdminUI();
        nav('matches');
    </script>
</body>
</html>
