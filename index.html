<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EA FC Mobile: VRFL Edition</title>
    <style>
        :root { --accent: #1cfc03; --bg: #0b0e11; --panel: #1c2127; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 10px; }
        .screen { display: none; } .active { display: block; }
        
        /* EA FC Style UI */
        .tile { background: var(--panel); border-radius: 10px; padding: 15px; margin: 10px 0; cursor: pointer; border: 1px solid #333; }
        .tile:active { border-color: var(--accent); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); padding-bottom: 5px; }
        
        /* Поле матча */
        #pitch { width: 100%; height: 180px; background: #228b22; position: relative; border: 2px solid white; overflow: hidden; border-radius: 8px; margin: 10px 0; }
        #ball { width: 10px; height: 10px; background: white; border-radius: 50%; position: absolute; top: 50%; left: 50%; transition: 0.6s; }
        
        /* Таблица */
        table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 8px; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #333; }
        .btn { background: var(--accent); color: black; border: none; padding: 15px; width: 100%; font-weight: bold; border-radius: 8px; margin-top: 10px; }
        
        .stat-bar { background: #333; height: 10px; border-radius: 5px; margin-top: 5px; }
        .stat-fill { background: var(--accent); height: 100%; border-radius: 5px; transition: 0.3s; }
    </style>
</head>
<body>

<div id="ui-header" class="header">
    <div id="user-club">Клуб: ---</div>
    <div id="user-money">$0</div>
</div>

<div id="menu-screen" class="screen active">
    <h2 id="current-week">Неделя 1</h2>
    <div class="tile" style="background: linear-gradient(45deg, #1cfc03, #008000); color: black;" onclick="startMatch()">СЛЕДУЮЩИЙ МАТЧ</div>
    <div class="tile" onclick="showScreen('table-screen')">ТАБЛИЦА ЛИГИ</div>
    <div class="tile" onclick="showScreen('transfer-screen')">ТРАНСФЕРЫ</div>
    <div>
        Репутация Тренера:
        <div class="stat-bar"><div id="rep-fill" class="stat-fill" style="width: 80%;"></div></div>
    </div>
</div>

<div id="match-screen" class="screen">
    <h3 id="match-title">Real vs Dedushki</h3>
    <div id="pitch"><div id="ball"></div></div>
    <div id="match-score" style="font-size: 2em; text-align: center;">0 : 0</div>
    <div id="match-log" style="height: 60px; font-size: 0.8em; color: #ccc;">Ожидание свистка...</div>
</div>

<div id="table-screen" class="screen">
    <h3>СУПЕРЛИГА</h3>
    <table id="league-table">
        <thead><tr><th>Клуб</th><th>И</th><th>О</th></tr></thead>
        <tbody></tbody>
    </table>
    <button class="btn" onclick="showScreen('menu-screen')">НАЗАД</button>
</div>

<div id="transfer-screen" class="screen">
    <h3>РЫНОК</h3>
    <div id="market-list"></div>
    <button class="btn" onclick="showScreen('menu-screen')">НАЗАД</button>
</div>

<script>
// --- БАЗА ДАННЫХ ---
let gameState = {
    money: 15000000,
    rep: 80,
    week: 1,
    myTeamId: 0,
    teams: [
        { id: 0, name: "FC Dedushki", points: 0, games: 0, power: 85 },
        { id: 1, name: "Real Madrid", points: 0, games: 0, power: 90 },
        { id: 2, name: "Man City", points: 0, games: 0, power: 92 },
        { id: 3, name: "FC Kokshetau", points: 0, games: 0, power: 75 },
        { id: 4, name: "Barcelona", points: 0, games: 0, power: 88 },
        { id: 5, name: "Bayern", points: 0, games: 0, power: 89 },
        { id: 6, name: "Arsenal", points: 0, games: 0, power: 86 },
        { id: 7, name: "PSG", points: 0, games: 0, power: 87 },
        { id: 8, name: "Liverpool", points: 0, games: 0, power: 88 },
        { id: 9, name: "Juventus", points: 0, games: 0, power: 84 }
    ],
    market: [
        { name: "Mbappe", price: 120000000, rat: 91 },
        { name: "Haaland", price: 110000000, rat: 90 },
        { name: "Mudryk", price: 40000000, rat: 78 }
    ]
};

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if(id === 'table-screen') updateTable();
    if(id === 'transfer-screen') updateMarket();
}

// --- СИСТЕМА МАТЧА ---
function startMatch() {
    showScreen('match-screen');
    let opponent = gameState.teams[Math.floor(Math.random() * 9) + 1];
    document.getElementById('match-title').innerText = `ВЫ vs ${opponent.name}`;
    
    let p1 = 0, p2 = 0, timer = 0;
    const ball = document.getElementById('ball');
    
    let matchInt = setInterval(() => {
        timer += 10;
        // Движение мяча
        ball.style.left = Math.random() * 90 + "%";
        ball.style.top = Math.random() * 90 + "%";
        
        // Шанс гола на основе силы (power)
        if(Math.random() * 100 < (gameState.teams[0].power / 10)) { p1++; document.getElementById('match-log').innerText = "ГОООЛ! Вы забили!"; }
        if(Math.random() * 100 < (opponent.power / 10)) { p2++; document.getElementById('match-log').innerText = `Гол! ${opponent.name} забивает...`; }
        
        document.getElementById('match-score').innerText = `${p1} : ${p2}`;
        
        if(timer >= 90) {
            clearInterval(matchInt);
            finishMatch(p1, p2, opponent);
        }
    }, 500);
}

function finishMatch(p1, p2, opp) {
    gameState.week++;
    gameState.teams[0].games++;
    opp.games++;
    
    if(p1 > p2) { 
        gameState.teams[0].points += 3; 
        gameState.money += 2000000;
        gameState.rep = Math.min(100, gameState.rep + 5);
    } else if(p1 === p2) { 
        gameState.teams[0].points += 1; opp.points += 1;
        gameState.money += 500000;
    } else { 
        opp.points += 3;
        gameState.rep -= 15;
    }

    // Симуляция остальных игр лиги
    gameState.teams.forEach(t => { if(t.id !== 0 && t.id !== opp.id) t.points += (Math.random() > 0.5 ? 3 : 1); });

    updateUI();
    setTimeout(() => {
        if(gameState.rep <= 0) { alert("Вас УВОЛИЛИ! Репутация на нуле."); location.reload(); }
        else { showScreen('menu-screen'); }
    }, 2000);
}

// --- ТРАНСФЕРЫ И UI ---
function updateMarket() {
    const list = document.getElementById('market-list');
    list.innerHTML = '';
    gameState.market.forEach(p => {
        list.innerHTML += `<div class="tile" onclick="buyPlayer(${p.price}, ${p.rat})">
            ${p.name} (Рейтинг: ${p.rat}) - $${(p.price/1000000).toFixed(1)}M
        </div>`;
    });
}

function buyPlayer(price, rat) {
    if(gameState.money >= price) {
        gameState.money -= price;
        gameState.teams[0].power += (rat / 10);
        alert("Игрок куплен! Сила состава выросла.");
        updateUI();
        showScreen('menu-screen');
    } else {
        alert("Недостаточно денег!");
    }
}

function updateTable() {
    const tbody = document.querySelector('#league-table tbody');
    tbody.innerHTML = '';
    let sorted = [...gameState.teams].sort((a,b) => b.points - a.points);
    sorted.forEach(t => {
        tbody.innerHTML += `<tr><td>${t.name}</td><td>${t.games}</td><td>${t.points}</td></tr>`;
    });
}

function updateUI() {
    document.getElementById('user-club').innerText = `Клуб: ${gameState.teams[0].name}`;
    document.getElementById('user-money').innerText = `$${(gameState.money/1000000).toFixed(1)}M`;
    document.getElementById('current-week').innerText = `Неделя ${gameState.week}`;
    document.getElementById('rep-fill').style.width = gameState.rep + "%";
}

updateUI();
</script>
</body>
</html>
