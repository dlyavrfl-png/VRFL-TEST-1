<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SofaScore Ultra Neon v7.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --neon-blue: #374DF5; --neon-green: #00E676; --dark-bg: #0C0F14; --card-bg: #161B22; }
        body { background: var(--dark-bg); color: white; font-family: 'Inter', sans-serif; margin: 0; }
        
        /* НЕОНОВЫЙ ПЛЮШ */
        .neon-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .neon-text-blue { color: var(--neon-blue); text-shadow: 0 0 10px rgba(55, 77, 245, 0.5); }
        .neon-text-green { color: var(--neon-green); text-shadow: 0 0 10px rgba(0, 230, 118, 0.5); }
        
        /* ЗАГРУЗКА 1.5 СЕКУНДЫ */
        #splash { position: fixed; inset: 0; background: var(--dark-bg); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease; }
        .loader { width: 60px; height: 60px; border: 4px solid rgba(55, 77, 245, 0.1); border-top: 4px solid var(--neon-blue); border-radius: 50%; animation: spin 0.8s linear infinite; filter: drop-shadow(0 0 5px var(--neon-blue)); }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ПОЛЕ */
        .pitch { background: #1a221a; background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 30px 30px; border-radius: 16px; position: relative; border: 1px solid rgba(255,255,255,0.1); }
        .p-node { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; z-index: 10; }
        .p-img { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--neon-blue); background: #222; box-shadow: 0 0 10px rgba(55, 77, 245, 0.3); }
        .p-rating { background: var(--neon-green); color: black; font-size: 8px; font-weight: 900; padding: 1px 4px; border-radius: 4px; margin-top: -8px; z-index: 20; }
        
        .active-tab { border-bottom: 3px solid var(--neon-blue); color: var(--neon-blue) !important; }
        .nav-active { color: var(--neon-blue) !important; filter: drop-shadow(0 0 5px var(--neon-blue)); }
        
        .modal-full { display: none; position: fixed; inset: 0; background: var(--dark-bg); z-index: 2000; overflow-y: auto; padding-bottom: 100px; }
        input, select { background: #1C2128 !important; border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; }
    </style>
</head>
<body class="pb-24">

    <div id="splash">
        <div class="loader mb-6"></div>
        <h1 class="text-white font-black italic text-3xl tracking-tighter">SOFA<span class="text-blue-500">SCORE</span></h1>
        <p class="text-gray-500 text-[10px] uppercase font-bold tracking-[0.4em] mt-2">Ultra Edition v7.0</p>
    </div>

    <div class="bg-[#11161D] p-6 pt-12 flex justify-between items-center border-b border-white/5">
        <h1 class="font-black text-2xl italic tracking-tighter">SOFA<span class="text-blue-500">SCORE</span></h1>
        <button onclick="requestAdmin()" class="opacity-30"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg></button>
    </div>

    <div id="view-matches" class="p-4 space-y-4"></div>
    
    <div id="view-standings" class="p-4 hidden">
        <div class="neon-card rounded-2xl p-5">
            <h2 class="font-black text-xs uppercase mb-6 flex items-center gap-2"><span class="w-1 h-4 bg-blue-600"></span> Live Table</h2>
            <table class="w-full text-left text-xs">
                <thead><tr class="text-gray-500 border-b border-white/5"><th class="pb-3">#</th><th class="pb-3">КЛУБ</th><th class="pb-3 text-center">О</th></tr></thead>
                <tbody id="standings-list"></tbody>
            </table>
        </div>
    </div>

    <div id="view-scorers" class="p-4 hidden space-y-4"></div>

    <div id="club-modal" class="modal-full">
        <div class="p-6">
            <button onclick="closeClub()" class="mb-6"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
            <div class="flex items-center gap-6 mb-8">
                <div id="c-logo" class="w-24 h-24 rounded-3xl bg-white/5 border border-white/10 bg-cover shadow-2xl"></div>
                <div>
                    <h2 id="c-name" class="text-3xl font-black italic tracking-tighter"></h2>
                    <p id="c-stadium" class="text-blue-500 text-[10px] font-bold uppercase tracking-widest mt-1"></p>
                </div>
            </div>
            <div id="c-stats" class="grid grid-cols-3 gap-3 mb-10 text-center"></div>
            <h3 class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-4">Лучшие в сезоне</h3>
            <div id="c-leaders" class="space-y-2 mb-8"></div>
            <h3 class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-4">Последние игры</h3>
            <div id="c-history" class="space-y-2"></div>
        </div>
    </div>

    <div id="player-modal" class="modal-full flex items-center justify-center bg-black/90">
        <div class="neon-card w-[90%] max-w-sm rounded-[32px] overflow-hidden">
            <div class="p-8 bg-gradient-to-b from-[#1A1F26] to-[#161B22] text-center">
                <div class="w-20 h-20 rounded-full border-2 border-blue-500 mx-auto mb-4 p-1"><div id="pm-photo" class="w-full h-full rounded-full bg-cover"></div></div>
                <h3 id="pm-name" class="font-black text-2xl tracking-tight"></h3>
                <p id="pm-team" class="text-blue-500 text-[10px] font-bold uppercase"></p>
            </div>
            <div class="p-6 grid grid-cols-2 gap-3" id="pm-stats-display"></div>
            <div id="pm-admin" class="hidden p-6 border-t border-white/5 space-y-3 bg-red-500/5">
                <div class="grid grid-cols-3 gap-2">
                    <input id="ai-g" type="number" placeholder="Г" class="p-2 text-center rounded">
                    <input id="ai-a" type="number" placeholder="А" class="p-2 text-center rounded">
                    <input id="ai-s" type="number" placeholder="У" class="p-2 text-center rounded">
                    <input id="ai-st" type="number" placeholder="Вс" class="p-2 text-center rounded">
                    <input id="ai-t" type="number" placeholder="От" class="p-2 text-center rounded">
                    <input id="ai-r" type="number" step="0.1" placeholder="Р" class="p-2 text-center rounded">
                </div>
                <button onclick="savePlayer()" class="w-full bg-blue-600 p-3 rounded-xl font-black uppercase text-[10px]">Сохранить статы</button>
            </div>
            <button onclick="document.getElementById('player-modal').style.display='none'" class="w-full p-4 text-gray-500 font-bold uppercase text-[10px]">Закрыть</button>
        </div>
    </div>

    <div id="match-page" class="modal-full">
        <div class="bg-[#161B22] p-6 pt-12 border-b border-white/5">
            <button onclick="closeMatch()" class="mb-8"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
            <div class="flex justify-around items-center text-center">
                <div class="w-1/3" onclick="openClub(curM().home)">
                    <div id="mh-logo" class="w-16 h-16 mx-auto rounded-2xl bg-cover mb-2 border border-white/5"></div>
                    <p id="mh-name" class="text-[10px] font-black uppercase"></p>
                </div>
                <div class="w-1/3">
                    <div id="m-score" class="text-5xl font-black italic tracking-tighter"></div>
                    <div class="text-[9px] font-black text-red-500 bg-red-500/10 px-3 py-1 rounded-full inline-block mt-3">LIVE</div>
                </div>
                <div class="w-1/3" onclick="openClub(curM().away)">
                    <div id="ma-logo" class="w-16 h-16 mx-auto rounded-2xl bg-cover mb-2 border border-white/5"></div>
                    <p id="ma-name" class="text-[10px] font-black uppercase"></p>
                </div>
            </div>
        </div>
        <div class="p-4 space-y-4">
            <div class="pitch w-full h-80"><div id="pitch-layers"></div></div>
            <div id="m-timeline" class="neon-card p-6 rounded-2xl space-y-4"></div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-[#11161D] border-t border-white/5 flex justify-around py-5 z-40">
        <button onclick="nav('matches')" id="nv-matches" class="flex flex-col items-center gap-1 nav-active text-gray-500"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg></button>
        <button onclick="nav('standings')" id="nv-standings" class="flex flex-col items-center gap-1 text-gray-500"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg></button>
        <button onclick="nav('scorers')" id="nv-scorers" class="flex flex-col items-center gap-1 text-gray-500"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></button>
    </div>

    <script>
        let state = JSON.parse(localStorage.getItem('sofa_v7_data')) || {
            isAdmin: false,
            teams: {
                'Meridian Greenwich': { logo: '', stadium: 'London Stadium', cap: '20,000', players: [
                    {id: 1, name: 'Niko', r: 8.5, g: 12, a: 5, s: 30, st: 15, t: 4, pos: {t: '20%', l: '50%'}},
                    {id: 2, name: 'Acsor', r: 7.8, g: 2, a: 9, s: 10, st: 4, t: 28, pos: {t: '45%', l: '35%'}},
                    {id: 3, name: 'Kelf', r: 8.1, g: 4, a: 1, s: 12, st: 5, t: 15, pos: {t: '45%', l: '65%'}}
                ]},
                'Lions': { logo: '', stadium: 'Lion Arena', cap: '15,000', players: [
                    {id: 4, name: 'Mels', r: 7.4, g: 7, a: 2, s: 25, st: 10, t: 3, pos: {t: '80%', l: '50%'}},
                    {id: 5, name: 'Alex', r: 6.9, g: 1, a: 0, s: 5, st: 2, t: 40, pos: {t: '65%', l: '40%'}}
                ]},
                'Phoenix': { logo: '', stadium: 'Fire Dome', cap: '12,000', players: [
                    {id: 6, name: 'Vantuz', r: 7.5, g: 3, a: 4, s: 15, st: 8, t: 12, pos: {t: '55%', l: '50%'}}
                ]}
            },
            matches: [
                {id: 1, home: 'Meridian Greenwich', away: 'Lions', hScore: 2, aScore: 1, status: 'LIVE', events: [{min: 23, txt: 'Niko забивает ударом в девятку'}]}
            ]
        };

        const save = () => localStorage.setItem('sofa_v7_data', JSON.stringify(state));
        setTimeout(() => { document.getElementById('splash').style.opacity = '0'; setTimeout(() => document.getElementById('splash').remove(), 500); }, 1500);

        function nav(v) {
            ['matches', 'standings', 'scorers'].forEach(x => {
                document.getElementById('view-'+x).classList.add('hidden');
                document.getElementById('nv-'+x).classList.remove('nav-active');
            });
            document.getElementById('view-'+v).classList.remove('hidden');
            document.getElementById('nv-'+v).classList.add('nav-active');
            if(v === 'matches') renderMatches();
            if(v === 'standings') renderStandings();
            if(v === 'scorers') renderScorers();
        }

        function renderMatches() {
            document.getElementById('view-matches').innerHTML = state.matches.map(m => `
                <div onclick="openMatch(${m.id})" class="neon-card p-5 rounded-2xl flex justify-between items-center active:scale-95 transition-transform">
                    <div class="w-12 text-[10px] font-black text-red-500 italic">LIVE</div>
                    <div class="flex-1 px-4 space-y-2">
                        <div class="flex items-center gap-3"><div class="w-5 h-5 rounded-md border border-white/10 bg-cover" style="background-image:url('${state.teams[m.home].logo}')"></div><span class="text-xs font-bold">${m.home}</span></div>
                        <div class="flex items-center gap-3"><div class="w-5 h-5 rounded-md border border-white/10 bg-cover" style="background-image:url('${state.teams[m.away].logo}')"></div><span class="text-xs font-bold">${m.away}</span></div>
                    </div>
                    <div class="text-right font-black text-2xl italic tracking-tighter"><div>${m.hScore}</div><div>${m.aScore}</div></div>
                </div>
            `).join('');
        }

        let activeMid = null;
        const curM = () => state.matches.find(x => x.id === activeMid);

        function openMatch(id) {
            activeMid = id; const m = curM();
            document.getElementById('mh-name').innerText = m.home;
            document.getElementById('ma-name').innerText = m.away;
            document.getElementById('m-score').innerText = `${m.hScore}-${m.aScore}`;
            document.getElementById('mh-logo').style.backgroundImage = `url('${state.teams[m.home].logo}')`;
            document.getElementById('ma-logo').style.backgroundImage = `url('${state.teams[m.away].logo}')`;
            
            const layers = document.getElementById('pitch-layers');
            layers.innerHTML = '';
            [...state.teams[m.home].players, ...state.teams[m.away].players].forEach(p => {
                const d = document.createElement('div');
                d.className = 'p-node'; d.style.top = p.pos.t; d.style.left = p.pos.l;
                d.onclick = (e) => { e.stopPropagation(); openPlayer(p.id); };
                d.innerHTML = `<div class="p-img"></div><div class="p-rating">${p.r}</div><span class="text-[8px] font-bold mt-1 text-white/70">${p.name}</span>`;
                layers.appendChild(d);
            });
            
            document.getElementById('m-timeline').innerHTML = m.events.map(e => `
                <div class="flex gap-4 border-l-2 border-blue-600 pl-4 py-1"><span class="text-xs font-black text-blue-500">${e.min}'</span><span class="text-xs">${e.txt}</span></div>
            `).join('');
            document.getElementById('match-page').style.display = 'block';
        }

        function closeMatch() { document.getElementById('match-page').style.display = 'none'; }

        // --- CLUB ---
        function openClub(name) {
            const t = state.teams[name];
            document.getElementById('c-name').innerText = name;
            document.getElementById('c-logo').style.backgroundImage = `url('${t.logo}')`;
            document.getElementById('c-stadium').innerText = `${t.stadium} • CAP ${t.cap}`;
            
            const hist = state.matches.filter(m => m.home === name || m.away === name);
            document.getElementById('c-stats').innerHTML = `
                <div class="bg-white/5 p-3 rounded-xl"><p class="text-[9px] text-gray-500 uppercase font-black">Игр</p><p class="text-xl font-black">${hist.length}</p></div>
                <div class="bg-blue-600/10 p-3 rounded-xl"><p class="text-[9px] text-blue-500 uppercase font-black">Очки</p><p class="text-xl font-black">${hist.length * 3}</p></div>
                <div class="bg-white/5 p-3 rounded-xl"><p class="text-[9px] text-gray-500 uppercase font-black">Форма</p><p class="text-xl font-black text-green-500">W</p></div>
            `;
            
            const scorers = [...t.players].sort((a,b) => b.g - a.g).slice(0,2);
            document.getElementById('c-leaders').innerHTML = scorers.map(p => `
                <div class="bg-white/5 p-4 rounded-2xl flex justify-between items-center">
                    <span class="text-xs font-bold">${p.name}</span>
                    <span class="text-xs font-black text-blue-500">${p.g} Г / ${p.a} А</span>
                </div>
            `).join('');
            document.getElementById('club-modal').style.display = 'block';
        }
        function closeClub() { document.getElementById('club-modal').style.display = 'none'; }

        // --- PLAYER ---
        let activePid = null;
        function openPlayer(id) {
            activePid = id; let p;
            for(let t in state.teams) { let f = state.teams[t].players.find(x => x.id === id); if(f) p = f; }
            document.getElementById('pm-name').innerText = p.name;
            document.getElementById('pm-team').innerText = 'Season Stats 2026';
            const stats = [
                {n:'Голы', v:p.g}, {n:'Ассисты', v:p.a}, {n:'Удары', v:p.s}, 
                {n:'В створ', v:p.st}, {n:'Отборы', v:p.t}, {n:'Рейтинг', v:p.r}
            ];
            document.getElementById('pm-stats-display').innerHTML = stats.map(s => `
                <div class="bg-white/5 p-4 rounded-2xl text-center">
                    <p class="text-[8px] text-gray-500 uppercase font-black mb-1">${s.n}</p>
                    <p class="font-black text-lg ${s.n==='Рейтинг'?'text-green-500':'text-white'}">${s.v}</p>
                </div>
            `).join('');
            if(state.isAdmin) document.getElementById('pm-admin').classList.remove('hidden');
            document.getElementById('player-modal').style.display = 'flex';
        }

        function savePlayer() {
            let p; for(let t in state.teams) { let f = state.teams[t].players.find(x => x.id === activePid); if(f) p = f; }
            p.g = parseInt(document.getElementById('ai-g').value) || p.g;
            p.a = parseInt(document.getElementById('ai-a').value) || p.a;
            p.s = parseInt(document.getElementById('ai-s').value) || p.s;
            p.st = parseInt(document.getElementById('ai-st').value) || p.st;
            p.t = parseInt(document.getElementById('ai-t').value) || p.t;
            p.r = parseFloat(document.getElementById('ai-r').value) || p.r;
            save(); openPlayer(activePid);
        }

        function renderStandings() {
            let sorted = Object.keys(state.teams).sort((a,b) => 0); // Упрощенная логика
            document.getElementById('standings-list').innerHTML = sorted.map((name, i) => `
                <tr onclick="openClub('${name}')" class="border-b border-white/5">
                    <td class="py-4 font-black text-gray-500">${i+1}</td>
                    <td class="py-4"><div class="flex items-center gap-3"><div class="w-4 h-4 rounded bg-cover" style="background-image:url('${state.teams[name].logo}')"></div><span class="font-bold">${name}</span></div></td>
                    <td class="py-4 text-center font-black">3</td>
                </tr>
            `).join('');
        }

        function requestAdmin() { if(prompt('Pass:') === '1234') { state.isAdmin = true; save(); location.reload(); } }
        
        nav('matches');
    </script>
</body>
                    </html>
